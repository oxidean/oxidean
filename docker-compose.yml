# Default stack: Traefik + web + api + postgres (D-06, D-09)
# MySQL: docker compose -f docker-compose.yml -f docker-compose.mysql.yml --profile mysql up
# SQLite: see README — no DB service; set DATABASE_URL on api only

services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=false
    ports:
      - "80:80"
    # podman machine: SELinux blocks socket bind-mount access inside containers;
    # `label=disable` is a no-op on Docker and enables socket reads on podman.
    security_opt:
      - label=disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - oxidean

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oxidean}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oxidean}
      POSTGRES_DB: ${POSTGRES_DB:-oxidean}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oxidean} -d ${POSTGRES_DB:-oxidean}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - oxidean

  api:
    # Stable tag for CI same-run image reuse (docker save/load); local up --build retags too.
    image: oxidean-api:ci
    build:
      context: .
      dockerfile: crates/oxidean-api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://oxidean:oxidean@postgres:5432/oxidean}
      OXIDEAN_ENV: ${OXIDEAN_ENV:-compose}
      OXIDEAN_CORS_ORIGINS: ${OXIDEAN_CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      # Browser-facing origin for magic links + SSO (Traefik :80). Prefer
      # OXIDEAN_COMPOSE_PUBLIC_ORIGIN so a host `make dev` value of
      # OXIDEAN_PUBLIC_ORIGIN=http://localhost:3000 in `.env` does not leak in.
      OXIDEAN_PUBLIC_ORIGIN: ${OXIDEAN_COMPOSE_PUBLIC_ORIGIN:-http://localhost}
      API_BIND: 0.0.0.0:8080
      OXIDEAN_RPC_VERSION: ${OXIDEAN_RPC_VERSION:-1}
      RUST_LOG: ${RUST_LOG:-info}
      # Absolute path required: API CWD is `/`; relative var/repos breaks seed push from /tmp worktrees.
      OXIDEAN_REPOS_DIR: /var/repos
      # Branch-protection update-hook helper (ORG-06 / D-PKG-01) — shipped beside oxidean-api.
      OXIDEAN_PROTECTION_HELPER: /usr/local/bin/oxidean-protection-hook
      # Git LFS object store (D-LFS-01 / GIT-13) — absolute like REPOS_DIR.
      OXIDEAN_LFS_DIR: /var/lfs
      OXIDEAN_RELEASE_ASSETS_DIR: /var/release-assets
      # Package registry blob store (D-PKG-07) — distinct from repos / LFS / release-assets.
      OXIDEAN_PACKAGES_DIR: /var/packages
      OXIDEAN_PACKAGES_MAX_BLOB_BYTES: ${OXIDEAN_PACKAGES_MAX_BLOB_BYTES:-2147483648}
      OXIDEAN_PACKAGES_OWNER_QUOTA_BYTES: ${OXIDEAN_PACKAGES_OWNER_QUOTA_BYTES:-10737418240}
      # Instance template pack zips (issue #18) — content-addressed; distinct from packages.
      OXIDEAN_TEMPLATE_PACKS_DIR: /var/template-packs
      # Actions job logs (D-ACT-13) — distinct from repos / LFS / packages / release-assets.
      OXIDEAN_ACTIONS_LOG_DIR: /var/actions-logs
      OXIDEAN_ACTIONS_ENABLED: ${OXIDEAN_ACTIONS_ENABLED:-true}
      # Instance MCP endpoint gate (AGT-03) — admin UI override wins at runtime.
      OXIDEAN_MCP_ENABLED: ${OXIDEAN_MCP_ENABLED:-true}
      # Local-only default so repo Actions secrets work out of the box (D-ACT-17).
      # Production must set a unique OXIDEAN_ACTIONS_SECRETS_KEY — never reuse this value.
      OXIDEAN_ACTIONS_SECRETS_KEY: ${OXIDEAN_ACTIONS_SECRETS_KEY:-compose-dev-actions-secrets-key-not-for-production}
      # Reusable runner registration token for the compose actions profile.
      # The value below is a LOCAL-ONLY default — production must set a unique
      # token or leave unset (runners then register via per-runner DB tokens).
      OXIDEAN_RUNNER_REGISTRATION_TOKEN: ${OXIDEAN_RUNNER_REGISTRATION_TOKEN:-compose-dev-runner-registration-token}
      # Git-over-SSH (GIT-03 / D-SSH-07): in-process russh; raw TCP — not Traefik.
      OXIDEAN_SSH_ENABLED: ${OXIDEAN_SSH_ENABLED:-true}
      OXIDEAN_SSH_PORT: ${OXIDEAN_SSH_PORT:-2222}
      # Advertised hostname for CloneBox / smoke (scp-style git@host:owner/repo.git).
      # Fallback: hostname of OXIDEAN_PUBLIC_ORIGIN (Compose default localhost).
      OXIDEAN_SSH_HOST: ${OXIDEAN_SSH_HOST:-localhost}
      OXIDEAN_SSH_HOST_KEY_DIR: ${OXIDEAN_SSH_HOST_KEY_DIR:-/var/ssh}
    ports:
      # Host TCP publish for SSH (D-SSH-07) — do not add Traefik TCP/HTTP routers for SSH.
      - "2222:2222"
    volumes:
      # Avatar uploads (D-18) — api CWD is `/`, so bind to /var/uploads
      - ./var/uploads:/var/uploads
      # Bare repos (D-30 / D-38)
      - ./var/repos:/var/repos
      # Git LFS OID store (D-LFS-01) — instance-wide content-addressed objects
      - ./var/lfs:/var/lfs
      # Release assets volume (GIT-14 / D-REL-04) — distinct from LFS
      - ./var/release-assets:/var/release-assets
      # Package blobs (D-PKG-07) — content-addressed; not LFS or release-assets
      - ./var/packages:/var/packages
      # Instance template packs (issue #18) — content-addressed zip store
      - ./var/template-packs:/var/template-packs
      # Actions job logs (D-ACT-13) — {run_id}/{job_id}.log
      - ./var/actions-logs:/var/actions-logs
      # Persist SSH host keys across restarts (TOFU; D-SSH-07 / RESEARCH pitfall 5)
      - ssh_host_keys:/var/ssh
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=oxidean_oxidean
      # Smart HTTP (D-18 / D-22): /{owner}/{repo}.git → API before SPA catch-all (priority 110 > api 100 > web 1).
      - traefik.http.routers.api-git.rule=Host(`localhost`) && PathRegexp(`^/[^/]+/[^/]+\.git`)
      - traefik.http.routers.api-git.entrypoints=web
      - traefik.http.routers.api-git.priority=110
      - traefik.http.routers.api-git.service=api
      # Packages registry (D-PKG-01): /v2|/npm|/generic → API before SPA (priority 110).
      - traefik.http.routers.api-packages.rule=Host(`localhost`) && (PathPrefix(`/v2`) || PathPrefix(`/npm`) || PathPrefix(`/generic`) || PathPrefix(`/cli`))
      - traefik.http.routers.api-packages.entrypoints=web
      - traefik.http.routers.api-packages.priority=110
      - traefik.http.routers.api-packages.service=api
      - traefik.http.routers.api.rule=Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`) || Path(`/health`))
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.routers.api.priority=100
      - traefik.http.services.api.loadbalancer.server.port=8080
    networks:
      - oxidean

  # Official Actions runner sidecar — native oxidean-runner binary.
  # Opt-in: docker compose --profile actions up -d runner
  # Registration: the api accepts the same OXIDEAN_RUNNER_REGISTRATION_TOKEN
  # (dev default below is local-only — production must set a unique value or
  # disable the env-token path; mint per-runner DB tokens instead).
  runner:
    profiles: ["actions"]
    build:
      context: .
      dockerfile: docker/oxidean-runner/Dockerfile
    environment:
      # Runner-side API origin — the compose-internal api address also serves
      # smart HTTP clone URLs for actions/checkout.
      OXIDEAN_PUBLIC_ORIGIN: ${OXIDEAN_RUNNER_ORIGIN:-http://api:8080}
      OXIDEAN_RUNNER_REGISTRATION_TOKEN: ${OXIDEAN_RUNNER_REGISTRATION_TOKEN:-compose-dev-runner-registration-token}
      OXIDEAN_RUNNER_NAME: ${OXIDEAN_RUNNER_NAME:-compose-runner}
      # Host execution by default (no Docker daemon required). Add
      # `name:docker://image` labels to run steps inside containers — needs
      # the docker.sock mount below.
      OXIDEAN_RUNNER_LABELS: ${OXIDEAN_RUNNER_LABELS:-ubuntu-latest,self-hosted}
      # Optional PAT for cloning private repositories.
      OXIDEAN_RUNNER_GIT_TOKEN: ${OXIDEAN_RUNNER_GIT_TOKEN:-}
    volumes:
      - runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      api:
        condition: service_healthy
    networks:
      - oxidean

  web:
    image: oxidean-web:ci
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: "3000"
      # SSR Cookie-forward RPCs (bootstrap / session gate) — not 127.0.0.1 inside the container.
      OXIDEAN_API_ORIGIN: http://api:8080
      # Browser-facing origin for SSR clone URLs (Traefik Host(localhost)).
      OXIDEAN_PUBLIC_ORIGIN: ${OXIDEAN_COMPOSE_PUBLIC_ORIGIN:-http://localhost}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Same shape as api /health — dedicated probe, not SSR `/` (avoids "Started" forever).
      # Requires Oxidean-Health-Probe (public /health without header → 404).
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "-H",
          "Oxidean-Health-Probe: 1",
          "http://127.0.0.1:3000/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=oxidean_oxidean
      - traefik.http.routers.web.rule=Host(`localhost`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=3000
    networks:
      - oxidean

networks:
  oxidean:
    name: oxidean_oxidean

volumes:
  postgres_data:
  ssh_host_keys:
  runner_data:

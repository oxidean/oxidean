# Slim local auth/email stubs — no cloud secrets required.
#
# Host API + Vite (`make dev`):
#   cp docs/dev-auth.env.example .env.dev-auth
#   make up-dev-auth
#   set -a && source .env.dev-auth && set +a
#   # then run API + web on the host
#
# Compose API (`make up`) + stubs:
#   make up-with-dev-auth
#   # API SMTP → smtp://mailpit:1025 ; Mailpit UI http://127.0.0.1:8025
#
# Docs: docs/dev-auth.md

services:
  mailpit:
    profiles: ["dev-auth"]
    image: axllent/mailpit:v1.32
    ports:
      - "${OXIDEAN_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${OXIDEAN_MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - oxidean-dev-auth

  oidc-mock:
    profiles: ["dev-auth"]
    image: ghcr.io/navikt/mock-oauth2-server:6.1.2
    # Compose API + browser: issuer Host stays resolvable as host.docker.internal:9090.
    # Host `make dev` still discovers via 127.0.0.1:9090 (request Host drives issuer).
    hostname: host.docker.internal
    ports:
      - "${OXIDEAN_OIDC_MOCK_PORT:-9090}:8080"
    environment:
      SERVER_PORT: "8080"
      LOG_LEVEL: info
      # Match grant_type (always in token body). Matching client_id fails when the
      # OIDC client uses HTTP Basic and omits client_id from the form — mock then
      # issues a JWT without `sub`, and openidconnect rejects the token response.
      JSON_CONFIG: |
        {
          "interactiveLogin": false,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "tokenExpiry": 120,
              "requestMappings": [
                {
                  "requestParam": "grant_type",
                  "match": "authorization_code|.*",
                  "claims": {
                    "sub": "oidc-dev-user",
                    "aud": ["oxidean-dev"],
                    "email": "oidc@oxidean.local",
                    "email_verified": true,
                    "preferred_username": "oidcdev",
                    "name": "OIDC Dev"
                  }
                }
              ]
            }
          ]
        }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/default/.well-known/openid-configuration || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - oxidean-dev-auth

  stubs:
    profiles: ["dev-auth"]
    build:
      context: ./scripts/dev-auth
      dockerfile: Dockerfile
    ports:
      - "${OXIDEAN_STUBS_PORT:-9092}:9092"
    environment:
      PORT: "9092"
    networks:
      - oxidean-dev-auth

networks:
  oxidean-dev-auth:
    name: oxidean_dev_auth

          $ref: '#/components/schemas/Role'
        profile_incomplete:
          type: boolean
          description: True when username needs completion (e.g. after SSO with placeholder handle).
        email_verified:
          type: boolean
          description: True when the account email has been verified (D-13); wired in `user_to_public` in 05-02.
        must_change_credentials:
          type: boolean
          description: True when ENV-seeded admin must confirm credentials before normal use (AUTH-06).
        default_branch:
          type: string
          description: Default branch name for new repositories (D-09); defaults to `main`.
          default: main
        two_factor_enabled:
          type: boolean
          description: True when the account has at least one active 2FA factor (#130).
          default: false
        two_factor_enroll_required:
          type: boolean
          description: True when instance/org policy requires enrolling a factor (#130).
          default: false
      required:
      - id
      - email
      - username
      - display_name
      - bio
      - role
      - profile_incomplete
      - email_verified
      - must_change_credentials
      description: Public user profile returned over RPC (no password hash).
    Role:
      type: string
      enum:
      - user
      - admin
      - sys-admin
      description: 'Instance-level user role. Serialized as kebab-case: `user` | `admin` | `sys-admin`.'
    RepoListMineResponse:
      type: object
      properties:
        repos:
          type: array

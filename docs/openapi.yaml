          type: string
          description: Public slug label (username or org slug).
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/RepoVisibility'
        default_branch:
          type: string
        updated_at:
          type: string
        can_admin:
          type: boolean
          description: Caller has Admin capability (D-ORG-05 / settings UI).
          default: false
        can_write:
          type: boolean
          description: Caller has Write capability (D-ORG-05).
          default: false
        star_count:
          type: integer
          format: int64
          description: Denormalized star counter (D-SOC-02 / D-SOC-03).
          default: 0
        open_issue_count:
          type: integer
          format: int64
          description: Open issue count for the Issues tab badge (populated by repo.get).
          default: 0
        open_pull_count:
          type: integer
          format: int64
          description: Open pull-request count for the Pulls tab badge (populated by repo.get).
          default: 0
        viewer_has_starred:
          type: boolean
          description: Whether the authenticated viewer has starred this repo.
          default: false
        is_fork:
          type: boolean
          description: True when this repository is a fork of another.
          default: false
        is_template:
          type: boolean
          description: 'True when owners expose this repo as a create-from template (issue #18).'
          default: false
        archived:
          type: boolean
          description: |-
            Read-only archive mode (GIT-20): browse/clone stay open; pushes and
            content writes (issues, pulls, releases, branches, LFS uploads) are blocked.
          default: false
        homepage:
          type: string
          description: 'Project homepage URL / text (issue #23).'
          default: ''
        topics:
          type: array
          items:
            type: string
          description: 'Topic slugs (issue #23).'
          default: []
        fork_count:
          type: integer
          format: int64
          description: 'Active forks in this repo''s network (issue #23).'
          default: 0
        watch_count:
          type: integer
          format: int64
          description: 'Watch / subscribe counter (issue #23).'
          default: 0
        viewer_is_watching:
          type: boolean
          description: |-
            Whether the authenticated viewer is watching this repo
            (subscription row at a non-`ignore` level).
          default: false
        viewer_watch_level:
          anyOf:
          - $ref: '#/components/schemas/WatchLevel'
          - type: 'null'
          description: |-
            Authenticated viewer's watch level — `all` | `participating` | `ignore`;
            absent when the viewer has no subscription row (DEBT-06).
        issues_enabled:
          type: boolean
          description: |-
            Issues unit enabled — gates `issue.*` RPCs + the Issues tab (COL-13).
            Populated by `repo.get`; list endpoints may report the default `true`.
          default: true
        pulls_enabled:
          type: boolean
          description: |-
            Pull-requests unit enabled — gates `pull.*` RPCs + the Pulls tab (COL-13).
            Populated by `repo.get`; list endpoints may report the default `true`.
          default: true
        wiki_enabled:
          type: boolean
          description: |-
            Wiki unit enabled — gates `wiki.*` RPCs, `{name}.wiki.git` transport
            access, and the Wiki tab (COL-13). Populated by `repo.get`.
          default: true
        projects_enabled:
          type: boolean
          description: |-
            Projects unit enabled — gates `projects.*` RPCs and the Projects tab
            (COL-13). Populated by `repo.get`.
          default: true
        discussions_enabled:
          type: boolean
          description: |-
            Discussions unit enabled — gates `discussions.*` RPCs and the
            Discussions tab. Populated by `repo.get`.
          default: true

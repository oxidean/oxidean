components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: domain.error_code
        message:
          type: string
        data:
          description: optional structured detail
    RepoVisibility:
      description: 'Repo visibility. Serialized lowercase: `public` | `private`.'
      type: string
      enum:
      - public
      - private
    MergeMethod:
      type: string
      enum:
      - merge
      - squash
      - rebase
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        database:
          type: string
          description: '`"ok"`, `"error"`, or `"skipped"` when no DATABASE_URL / ping not attempted.'
      required:
      - status
      - version
      - database
    UserPublic:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string

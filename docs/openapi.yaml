components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: domain.error_code
        message:
          type: string
        data:
          description: optional structured detail
    RepoVisibility:
      description: 'Repo visibility. Serialized lowercase: `public` | `private`.'
      type: string
      enum:
      - public
      - private
    MergeMethod:
      type: string
      enum:
      - merge
      - squash
      - rebase
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        database:
          type: string
          description: '`"ok"`, `"error"`, or `"skipped"` when no DATABASE_URL / ping not attempted.'
      required:
      - status
      - version
      - database
    UserPublic:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        avatar_url:
          type:
          - string
          - 'null'
          description: Public URL path (e.g. `/uploads/avatars/{id}.webp`), not a filesystem path.
        role:
          $ref: '#/components/schemas/Role'
        profile_incomplete:
          type: boolean
          description: True when username needs completion (e.g. after SSO with placeholder handle).
        email_verified:
          type: boolean
          description: True when the account email has been verified (D-13); wired in `user_to_public` in 05-02.
        must_change_credentials:
          type: boolean
          description: True when ENV-seeded admin must confirm credentials before normal use (AUTH-06).
        default_branch:
          type: string
          description: Default branch name for new repositories (D-09); defaults to `main`.
          default: main
      required:
      - id
      - email
      - username
      - display_name
      - bio
      - role
      - profile_incomplete
      - email_verified
      - must_change_credentials
      description: Public user profile returned over RPC (no password hash).
    Role:
      type: string
      enum:
      - user
      - admin
      - sys-admin
      description: 'Instance-level user role. Serialized as kebab-case: `user` | `admin` | `sys-admin`.'
    RepoListMineResponse:
      type: object
      properties:
        repos:
          type: array
          items:
            $ref: '#/components/schemas/RepoPublic'
      required:
      - repos
      description: '`repo.listMine` — caller''s non-deleted repos, recently updated first (GIT-01 / D-13).'
    RepoPublic:
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: string
        owner_type:
          $ref: '#/components/schemas/OwnerType'
          description: 'Polymorphic owner: `user` | `org` (D-ORG-01).'
        owner_username:
          type: string
          description: Public slug label (username or org slug).
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/RepoVisibility'
        default_branch:
          type: string
        updated_at:
          type: string
        can_admin:
          type: boolean
          description: Caller has Admin capability (D-ORG-05 / settings UI).
          default: false
        can_write:
          type: boolean
          description: Caller has Write capability (D-ORG-05).
          default: false
        star_count:
          type: integer
          format: int64
          description: Denormalized star counter (D-SOC-02 / D-SOC-03).
          default: 0
        open_issue_count:
          type: integer
          format: int64
          description: Open issue count for the Issues tab badge (populated by repo.get).
          default: 0
        open_pull_count:
          type: integer
          format: int64
          description: Open pull-request count for the Pulls tab badge (populated by repo.get).
          default: 0
        viewer_has_starred:
          type: boolean
          description: Whether the authenticated viewer has starred this repo.
          default: false
        is_fork:
          type: boolean
          description: True when this repository is a fork of another.
          default: false
        is_template:
          type: boolean
          description: 'True when owners expose this repo as a create-from template (issue #18).'
          default: false
        archived:
          type: boolean
          description: |-
            Read-only archive mode (GIT-20): browse/clone stay open; pushes and
            content writes (issues, pulls, releases, branches, LFS uploads) are blocked.
          default: false
        homepage:
          type: string
          description: 'Project homepage URL / text (issue #23).'
          default: ''
        topics:
          type: array
          items:
            type: string
          description: 'Topic slugs (issue #23).'
          default: []
        fork_count:
          type: integer
          format: int64
          description: 'Active forks in this repo''s network (issue #23).'
          default: 0
        watch_count:
          type: integer
          format: int64
          description: 'Watch / subscribe counter (issue #23).'
          default: 0
        viewer_is_watching:
          type: boolean
          description: |-
            Whether the authenticated viewer is watching this repo
            (subscription row at a non-`ignore` level).
          default: false
        viewer_watch_level:
          anyOf:
          - $ref: '#/components/schemas/WatchLevel'
          - type: 'null'
          description: |-
            Authenticated viewer's watch level — `all` | `participating` | `ignore`;
            absent when the viewer has no subscription row (DEBT-06).
        issues_enabled:
          type: boolean
          description: |-
            Issues unit enabled — gates `issue.*` RPCs + the Issues tab (COL-13).
            Populated by `repo.get`; list endpoints may report the default `true`.
          default: true
        pulls_enabled:
          type: boolean
          description: |-
            Pull-requests unit enabled — gates `pull.*` RPCs + the Pulls tab (COL-13).
            Populated by `repo.get`; list endpoints may report the default `true`.
          default: true
        fork_network_id:
          type:
          - string
          - 'null'
          description: Fork network root id (own id for roots) — D-SOC-14 / D-PR-01.
        forked_from:
          anyOf:
          - $ref: '#/components/schemas/ForkParentSummary'
          - type: 'null'
          description: Immediate parent when `is_fork` (D-SOC-16).
      required:
      - id
      - owner_id
      - owner_type
      - owner_username
      - name
      - description
      - visibility
      - default_branch
      - updated_at
      description: Public repository metadata returned over RPC.
    OwnerType:
      type: string
      enum:
      - user
      - org
      description: |-
        Polymorphic repository owner discriminant (D-ORG-01).
        Serialized lowercase: `user` | `org`.
    WatchLevel:
      oneOf:
      - type: string
        const: all
        description: Notified on all repo activity (default for `repo.watch`).
      - type: string
        const: participating
        description: Notified only when participating or @-mentioned (stored default).
      - type: string
        const: ignore
        description: Never notified for this repo — suppresses participation + mention rows.
      description: |-
        Per-user repository watch level — the notification matrix (DEBT-06).
        Serialized snake_case: `all` | `participating` | `ignore`.
    ForkParentSummary:
      type: object
      properties:
        id:
          type: string
        owner:
          type: string
        name:
          type: string
      required:
      - id
      - owner
      - name
      description: Parent summary when this repo is a fork (D-SOC-16).
    OrgListMineResponse:
      type: object
      properties:
        orgs:
          type: array
          items:
            $ref: '#/components/schemas/OrgMineEntry'
      required:
      - orgs
      description: '`org.listMine` response.'
    OrgMineEntry:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        display_name:
          type: string
        member_base_permission:
          $ref: '#/components/schemas/MemberBasePermission'
        role:
          $ref: '#/components/schemas/OrgRole'
        created_at:
          type: string
        updated_at:
          type: string
      required:
      - id
      - slug
      - display_name
      - member_base_permission
      - role
      - created_at
      - updated_at
      description: One org in `org.listMine` — includes caller's membership role.
    MemberBasePermission:
      type: string
      enum:
      - none
      - read
      - write
      description: |-
        Default Member permission on org private repos (D-ORG-02b).
        Serialized lowercase: `none` | `read` | `write`.
    OrgRole:
      type: string
      enum:
      - owner
      - admin
      - member
      description: 'Org membership role (D-ORG-02a). Serialized lowercase: `owner` | `admin` | `member`.'
    PublicUserProfile:
      type: object
      properties:
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        avatar_url:
          type:
          - string
          - 'null'
        follower_count:
          type: integer
          format: int64
          description: Accounts following this user (DEBT-06).
          default: 0
        following_count:
          type: integer
          format: int64
          description: Accounts this user follows (DEBT-06).
          default: 0
        viewer_is_following:
          type: boolean
          description: Whether the authenticated viewer follows this user (DEBT-06).
          default: false
      required:
      - username
      - display_name
      - bio
      description: Public profile DTO — never includes email (D-SOC-06).
    OrgPublic:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        display_name:
          type: string
        member_base_permission:
          $ref: '#/components/schemas/MemberBasePermission'
        created_at:
          type: string
        updated_at:
          type: string
      required:
      - id
      - slug
      - display_name
      - member_base_permission
      - created_at
      - updated_at
      description: Public organization profile returned over RPC (ORG-01).
    OrgMembersListResponse:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/OrgMemberPublic'
      required:
      - members
      description: '`org.members.list` response.'
    OrgMemberPublic:
      type: object
      properties:
        user_id:
          type: string
        username:
          type: string
        role:
          $ref: '#/components/schemas/OrgRole'
        created_at:
          type: string
      required:
      - user_id
      - username
      - role
      - created_at
      description: Public membership row — no email (ORG-01).

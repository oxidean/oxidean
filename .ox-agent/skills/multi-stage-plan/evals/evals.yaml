schema_version: 1
skill: ox-agent/multi-stage-plan
cases:
  - id: stage-decomposition
    prompt: >-
      Decompose the approved spec into small, dependency-aware, testable
      stages.
    expected:
      output_schema_valid: true
      stages_bounded: true
      dependencies_mapped: true
  - id: gates
    prompt: >-
      Give each stage a gate a later verify run can check, with risks and
      assumptions in findings.
    expected:
      output_schema_valid: true
      gates_defined: true
  - id: respects-scope
    prompt: >-
      Execute the skill using only the supplied work-item context and
      constraints.
    expected:
      output_schema_valid: true
      preserves_scope: true
thresholds:
  schema_pass_rate: 1.0
  quality_pass_rate: 0.9

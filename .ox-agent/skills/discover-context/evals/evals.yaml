schema_version: 1
skill: ox-agent/discover-context
cases:
  - id: harvest-standards
    prompt: >-
      Survey the repository and seeded context files for standards and
      decisions relevant to the work item, persisting entries under
      context/.
    expected:
      output_schema_valid: true
      entries_written: true
      findings_summarized: true
  - id: bounded-read
    prompt: >-
      Work only from the repository and seeded context files; never invent
      project conventions.
    expected:
      output_schema_valid: true
      bounded_read: true
  - id: respects-scope
    prompt: >-
      Execute the skill using only the supplied work-item context and
      constraints.
    expected:
      output_schema_valid: true
      preserves_scope: true
thresholds:
  schema_pass_rate: 1.0
  quality_pass_rate: 0.9

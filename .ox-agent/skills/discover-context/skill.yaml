schema_version: 1
name: ox-agent/discover-context
version: 0.1.0
kind: core
category: discovery
description: >-
  Discover relevant project standards, architecture, ADRs, code patterns,
  tests, and constraints for the current work item.
compatibility:
  skill_api: 1
  ox_agent: '>=0.1.0-0 <0.2.0'
inputs:
  schema: schemas/input.schema.json
outputs:
  schema: schemas/output.schema.json
evaluation:
  suite: evals/evals.yaml
  minimum_pass_rate: 0.9

schema_version: 1
skill: ox-agent/progress
cases:
  - id: derive-status
    prompt: >-
      Summarize the work item's state strictly from its journal — completed
      stages, blockers, and legal next actions.
    expected:
      output_schema_valid: true
      journal_derived: true
      next_actions_legal: true
  - id: compact-status
    prompt: >-
      Keep the summary compact enough that a later run can resume from it.
    expected:
      output_schema_valid: true
      compact: true
  - id: respects-scope
    prompt: >-
      Execute the skill using only the supplied work-item context and
      constraints.
    expected:
      output_schema_valid: true
      preserves_scope: true
thresholds:
  schema_pass_rate: 1.0
  quality_pass_rate: 0.9

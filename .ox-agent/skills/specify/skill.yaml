schema_version: 1
name: ox-agent/specify
version: 0.1.0
kind: core
category: specification
description: >-
  Turn a work-item intent into a detailed, testable specification with
  explicit scope, contracts, and acceptance criteria.
compatibility:
  skill_api: 1
  ox_agent: '>=0.1.0-0 <0.2.0'
inputs:
  schema: schemas/input.schema.json
outputs:
  schema: schemas/output.schema.json
evaluation:
  suite: evals/evals.yaml
  minimum_pass_rate: 0.9

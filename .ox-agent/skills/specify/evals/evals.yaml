schema_version: 1
skill: ox-agent/specify
cases:
  - id: write-spec
    prompt: >-
      Turn the chosen direction into a spec artifact with testable
      acceptance criteria a verify run can check.
    expected:
      output_schema_valid: true
      acceptance_criteria_present: true
      contracts_defined: true
  - id: explicit-scope
    prompt: >-
      State in-scope and out-of-scope explicitly in the spec artifact.
    expected:
      output_schema_valid: true
      scope_explicit: true
  - id: respects-scope
    prompt: >-
      Execute the skill using only the supplied work-item context and
      constraints.
    expected:
      output_schema_valid: true
      preserves_scope: true
thresholds:
  schema_pass_rate: 1.0
  quality_pass_rate: 0.9

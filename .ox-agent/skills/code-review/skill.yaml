schema_version: 1
name: ox-agent/code-review
version: 0.1.0
kind: core
category: review
description: >-
  Independently review an implementation against its specification,
  security boundaries, maintainability, and test quality.
compatibility:
  skill_api: 1
  ox_agent: '>=0.1.0-0 <0.2.0'
inputs:
  schema: schemas/input.schema.json
outputs:
  schema: schemas/output.schema.json
evaluation:
  suite: evals/evals.yaml
  minimum_pass_rate: 0.9

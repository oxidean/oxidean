schema_version: 1
skill: ox-agent/clean-user-facing-text
cases:
  - id: unicode-audit
    prompt: >-
      Inspect the provided user-facing text for invisible Unicode carriers
      with scripts/inspect_text.py, report findings by kind, and do not
      rewrite.
    expected:
      output_schema_valid: true
      unicode_reported: true
  - id: measured-rewrite
    prompt: >-
      Score the supplied prose with score_stylometry.py, then clean only if
      density_tier is high while preserving every fact and the writer's
      voice.
    expected:
      output_schema_valid: true
      measured_before: true
      preserves_facts: true
  - id: respects-scope
    prompt: >-
      Execute the skill using only the supplied work-item context and
      constraints.
    expected:
      output_schema_valid: true
      preserves_scope: true
thresholds:
  schema_pass_rate: 1.0
  quality_pass_rate: 0.9

schema_version: 1
name: ox-agent/brainstorm
version: 0.1.0
kind: core
category: brainstorming
description: >-
  Run structured divergent and convergent analysis for a work item while
  preserving disagreement and producing decision-ready options.
compatibility:
  skill_api: 1
  ox_agent: '>=0.1.0-0 <0.2.0'
inputs:
  schema: schemas/input.schema.json
outputs:
  schema: schemas/output.schema.json
evaluation:
  suite: evals/evals.yaml
  minimum_pass_rate: 0.9

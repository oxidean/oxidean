schema_version: 1
skill: ox-agent/brainstorm
cases:
  - id: divergent-directions
    prompt: >-
      Explore how work-item packets could reach a remote harness, producing
      distinct candidate directions with tradeoffs.
    expected:
      output_schema_valid: true
      divergent_options: true
      tradeoffs_documented: true
  - id: open-questions
    prompt: >-
      Compare two candidate stage orderings for the normal workflow while
      keeping unresolved disagreements visible.
    expected:
      output_schema_valid: true
      preserves_disagreement: true
  - id: respects-scope
    prompt: >-
      Execute the skill using only the supplied work-item context and
      constraints.
    expected:
      output_schema_valid: true
      preserves_scope: true
thresholds:
  schema_pass_rate: 1.0
  quality_pass_rate: 0.9

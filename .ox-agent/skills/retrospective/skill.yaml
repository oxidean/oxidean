schema_version: 1
name: ox-agent/retrospective
version: 0.1.0
kind: core
category: retrospective
description: >-
  Analyze a completed work item for quality, cost, rework, and process
  improvements without silently changing policy.
compatibility:
  skill_api: 1
  ox_agent: '>=0.1.0-0 <0.2.0'
inputs:
  schema: schemas/input.schema.json
outputs:
  schema: schemas/output.schema.json
evaluation:
  suite: evals/evals.yaml
  minimum_pass_rate: 0.9

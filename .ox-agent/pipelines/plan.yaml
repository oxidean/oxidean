name: plan
version: 1
steps:
  - id: discover
    skill: discover-context
    stage: discovery
  - id: brainstorm
    skill: brainstorm
    stage: brainstorming
  - id: specify
    skill: specify
    stage: specification
    depends_on: [discover, brainstorm]
  - id: plan
    skill: multi-stage-plan
    stage: planning
    depends_on: [specify]
  - id: validate
    skill: verify
    stage: verification
    depends_on: [plan]

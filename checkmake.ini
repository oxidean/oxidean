# checkmake config for the Oxidean root Makefile.
# https://github.com/checkmake/checkmake

[maxbodylength]
# help / coverage / compose targets are intentionally longer than the default 5.
# `help` enumerates every target one echo per line and grows with the Makefile
# surface; 60 leaves headroom while still catching runaway recipe bodies.
maxBodyLength = 60

[minphony]
# Classic all/clean are not part of this monorepo Make surface; require test only.
required = test

# stamped by the release train — see docs/VERSIONING.md (kind = "helm").
version: "0.1.0"
appVersion: "0.4.1"
kubeVersion: ">=1.25.0-0"
keywords:
  - git
  - forge
  - code-hosting
icon: https://raw.githubusercontent.com/oxidean/oxidean/main/brand/oxidean-mark.png
home: https://oxidean.dev
sources:
  - https://github.com/oxidean/oxidean

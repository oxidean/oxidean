{{- if not .Values.secrets.existingSecret -}}
{{- /*
Chart-managed Secret — lookup-guarded one-time generation. Precedence per key:
explicit value from .Values.secrets.* > value already in the cluster Secret
(lookup hit — upgrades keep what the install minted) > fresh randAlphaNum.
Everything is emitted through `data:` (base64); existing entries pass
through untouched.
The bundled DATABASE_URL is NOT here: its `$(POSTGRES_*)` expansion only runs
on literal env `value:` fields — see deployment-api.yaml.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "oxidean.secretName" .) -}}
{{- $d := default dict (get $existing "data") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oxidean.secretName" . }}
  labels:
    {{- include "oxidean.labels" . | nindent 4 }}
type: Opaque
data:
  OXIDEAN_ACTIONS_SECRETS_KEY: {{ default (randAlphaNum 48 | b64enc) (or (.Values.secrets.actionsSecretsKey | b64enc) (index $d "OXIDEAN_ACTIONS_SECRETS_KEY")) | quote }}
  OXIDEAN_SESSION_SECRET: {{ default (randAlphaNum 48 | b64enc) (or (.Values.secrets.sessionSecret | b64enc) (index $d "OXIDEAN_SESSION_SECRET")) | quote }}
{{- if .Values.secrets.secretsKey }}
  OXIDEAN_SECRETS_KEY: {{ .Values.secrets.secretsKey | b64enc | quote }}
{{- else if index $d "OXIDEAN_SECRETS_KEY" }}
  OXIDEAN_SECRETS_KEY: {{ index $d "OXIDEAN_SECRETS_KEY" | quote }}
{{- end }}
{{- if or .Values.admin.email .Values.secrets.adminPassword }}
  OXIDEAN_ADMIN_PASSWORD: {{ default (randAlphaNum 24 | b64enc) (or (.Values.secrets.adminPassword | b64enc) (index $d "OXIDEAN_ADMIN_PASSWORD")) | quote }}
{{- end }}
{{- if .Values.secrets.webFlowPrivateKey }}
  OXIDEAN_WEB_FLOW_PRIVATE_KEY: {{ .Values.secrets.webFlowPrivateKey | b64enc | quote }}
{{- else if index $d "OXIDEAN_WEB_FLOW_PRIVATE_KEY" }}
  OXIDEAN_WEB_FLOW_PRIVATE_KEY: {{ index $d "OXIDEAN_WEB_FLOW_PRIVATE_KEY" | quote }}
{{- end }}
{{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ default (randAlphaNum 48 | b64enc) (index $d "POSTGRES_PASSWORD") | quote }}
{{- end }}
{{- if .Values.database.url }}
  DATABASE_URL: {{ .Values.database.url | b64enc | quote }}
{{- end }}
{{- if or (eq .Values.storage.backend "s3") .Values.objectstore.enabled }}
{{- if and .Values.storage.s3.accessKeyId .Values.storage.s3.secretAccessKey }}
  OXIDEAN_S3_ACCESS_KEY_ID: {{ .Values.storage.s3.accessKeyId | b64enc | quote }}
  OXIDEAN_S3_SECRET_ACCESS_KEY: {{ .Values.storage.s3.secretAccessKey | b64enc | quote }}
{{- if .Values.storage.s3.sessionToken }}
  OXIDEAN_S3_SESSION_TOKEN: {{ .Values.storage.s3.sessionToken | b64enc | quote }}
{{- end }}
{{- else if .Values.objectstore.enabled }}
  OXIDEAN_S3_ACCESS_KEY_ID: {{ default (randAlphaNum 24 | b64enc) (index $d "OXIDEAN_S3_ACCESS_KEY_ID") | quote }}
  OXIDEAN_S3_SECRET_ACCESS_KEY: {{ default (randAlphaNum 48 | b64enc) (index $d "OXIDEAN_S3_SECRET_ACCESS_KEY") | quote }}
{{- end }}
{{- end }}
{{- if and .Values.runner.enabled .Values.runner.registrationToken }}
  OXIDEAN_RUNNER_REGISTRATION_TOKEN: {{ .Values.runner.registrationToken | b64enc | quote }}
{{- end }}
{{- range $k, $v := .Values.secrets.env }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
{{- end }}
{{- end }}

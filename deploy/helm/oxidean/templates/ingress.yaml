{{- if .Values.ingress.enabled -}}
{{- /*
One hostname is enough — the web tier reverse-proxies every API-owned path
(/api/*, /{o}/{r}.git, badges, /pages, /.well-known/oauth*, WS/SSE). TLS is
the ingress controller's job (annotations / cert-manager); there is no
bundled edge in this chart.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oxidean.fullname" . }}
  labels:
    {{- include "oxidean.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "oxidean.webServiceName" . }}
                port:
                  name: http
{{- end }}

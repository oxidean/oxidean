apiVersion: v1
kind: Service
metadata:
  name: {{ include "oxidean.webServiceName" . }}
  labels:
    {{- include "oxidean.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    {{- include "oxidean.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web

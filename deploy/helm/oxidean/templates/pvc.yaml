{{- /*
Volume plan — see values.yaml `storage` and the fs/s3 note in _helpers.tpl.
  fs                        → data PVC at /var
  s3 + retainDataVolume     → same /var PVC (inert envs until consumers land)
  s3 + !retainDataVolume    → /var/repos PVC only (target topology)
The SSH host-key PVC is mounted at /var/ssh in every mode — generated host
keys and the web-flow signing pair keep their trust chain across data-volume
replacement.
*/ -}}
{{- if and (include "oxidean.dataVolumeMounted" .) (not .Values.storage.data.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "oxidean.dataPvcName" . }}
  labels:
    {{- include "oxidean.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes: {{ .Values.storage.data.accessModes | toJson }}
  {{- include "oxidean.storageClass" .Values.storage.data.storageClass | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.storage.data.size | quote }}
---
{{- end }}
{{- if and (eq .Values.storage.backend "s3") (not .Values.storage.s3.retainDataVolume) (not .Values.storage.s3.repos.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "oxidean.reposPvcName" . }}
  labels:
    {{- include "oxidean.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes: {{ .Values.storage.s3.repos.accessModes | toJson }}
  {{- include "oxidean.storageClass" .Values.storage.s3.repos.storageClass | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.storage.s3.repos.size | quote }}
---
{{- end }}
{{- if and .Values.ssh.enabled (not .Values.ssh.hostKeys.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "oxidean.sshPvcName" . }}
  labels:
    {{- include "oxidean.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes: {{ .Values.ssh.hostKeys.accessModes | toJson }}
  {{- include "oxidean.storageClass" .Values.ssh.hostKeys.storageClass | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.ssh.hostKeys.size | quote }}
---
{{- end }}
{{- if and .Values.objectstore.enabled (not .Values.objectstore.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "oxidean.objectstorePvcName" . }}
  labels:
    {{- include "oxidean.labels" . | nindent 4 }}
    app.kubernetes.io/component: objectstore
spec:
  accessModes: {{ .Values.objectstore.persistence.accessModes | toJson }}
  {{- include "oxidean.storageClass" .Values.objectstore.persistence.storageClass | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.objectstore.persistence.size | quote }}
{{- end }}

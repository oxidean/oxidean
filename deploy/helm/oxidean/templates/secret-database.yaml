{{- /*
Dedicated Secret for a values-supplied database.url. Only rendered when
secrets.existingSecret is set — in that mode the chart-managed Secret does
not exist, and a credential-bearing URL must still reach the pod through a
secretKeyRef, never a literal env value in the Deployment spec.
*/ -}}
{{- if and .Values.secrets.existingSecret .Values.database.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oxidean.fullname" . }}-database
  labels:
    {{- include "oxidean.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}

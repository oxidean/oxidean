apiVersion: v1
kind: Service
metadata:
  name: {{ include "oxidean.apiServiceName" . }}
  labels:
    {{- include "oxidean.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "oxidean.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api

# cargo-nextest — parallel, CI-friendly Rust test runner (faster than `cargo test`).
# https://nexte.st/docs/configuration/

[profile.default]
# Fail fast in local runs; CI uses --profile ci.
slow-timeout = { period = "60s", terminate-after = 3 }

# The dialect_oxpilot binary mutates the shared `oxpilot_settings` singleton
# row on one DATABASE_URL; its in-process `SERIAL` mutex cannot serialize
# nextest's per-test processes — a test group does, across processes.
[profile.default.test-groups]
dialect-oxpilot = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary_id(oxidean-db::dialect_oxpilot)'
test-group = 'dialect-oxpilot'

[profile.ci]
# Full suite on every PR; keep going so dialect/auth flakes are all visible.
fail-fast = false
slow-timeout = { period = "90s", terminate-after = 3 }
test-threads = "num-cpus"
# One retry so a transient I/O hiccup (e.g. the unasserted-leg cache flake
# that red'd coverage run 40153046084) reports FLAKY instead of failing the
# lane — the api-rust shards already self-heal this way via their whole-
# suite `||` re-run; this covers coverage-weighted + db-dialects which have
# no shell-level retry, and it bounds the retry per test instead of
# re-running the entire archive.
retries = 1

# Same shared-singleton serialization as profile.default — the db-dialects
# lane runs PG/MySQL legs without --test-threads=1.
[profile.ci.test-groups]
dialect-oxpilot = { max-threads = 1 }

[[profile.ci.overrides]]
filter = 'binary_id(oxidean-db::dialect_oxpilot)'
test-group = 'dialect-oxpilot'

# The db-dialects lane replays workflow_conformance against real Postgres AND
# MySQL; the reusable-fanout cases expand 100+ callee legs, which is
# throughput-bound on the MySQL service container rather than hung.
[[profile.ci.overrides]]
filter = 'test(reusable_fanout)'
slow-timeout = { period = "180s", terminate-after = 3 }

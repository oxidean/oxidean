tag_prefix = "oxidean-api-v"
changelog_path = "crates/oxidean-api/CHANGELOG.md"
# The api binary is assembled from the shell crate plus oxidean-api-core and
# the per-domain `oxidean-api-*` dispatch crates (#162) — each registered as
# its own component below; depends_on propagation rolls every domain bump

# Authoritative teardown for stale per-PR surfaces — oxidean-pr-<n>
# Railway environments, "Oxidean / oxidean-pr-<n>" GitHub Environments,
# and pr-<n> GHCR tags.
#
# Why a standalone workflow: images.yml's pull_request:closed cleanup-pr
# run is routinely cancelled before jobs start — on merge GitHub removes
# refs/pull/<n>/merge and the queued run goes with it — so cleanup-pr is
# only a fast path. This sweep detects leaks on every surface and tears
# down each closed PR's lane via scripts/pr-env-sweep.sh →
# scripts/pr-env-teardown.sh. workflow_dispatch makes it manually
# runnable (e.g. after rotating RAILWAY_API_TOKEN).
#
# Secrets/vars:
#   RAILWAY_API_TOKEN  — account/workspace token; env-scoped project
#     tokens cannot enumerate environments (Bearer rejects them).
#   RELEASE_APP_ID (variable) + RELEASE_APP_PRIVATE_KEY (secret) — the
#     release GitHub App. Real environment deletes need Administration write
#     on the repo — Environments write only manages env secrets/variables
#     and cannot delete. The mint below asks for it, so a missing grant
#     fails that step loudly instead of cascading 403s; teardown then falls
#     back to marking the env's deployments inactive (Deployments write
#     covers that path — also granted to the job's GITHUB_TOKEN below).
#   RELEASE_TOKEN    — fallback maintainer PAT for the same purpose.

name: PR env sweep

on:
  # Hourly backstop — leaked envs hold volumes until the 20/project cap
  # breaks every later bind.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: pr-env-sweep
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: write # GHCR pr-<n> version deletes
  deployments: write # inactivate stale deployments when env delete is denied

jobs:
  sweep:
    name: sweep stale pr environments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: release app token (environment admin)
        id: apptok
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        # Scoped mint: ungranted scopes 422 the mint — loud in the run UI —
        # while continue-on-error lets teardown fall back to RELEASE_TOKEN /
        # github.token so the Railway + GHCR legs still run degraded.
        # administration is what DELETE /environments actually checks; while
        # the App lacks it the mint fails and teardown runs on the fallback
        # tokens, degrading env deletes to deployment inactivation. packages
        # covers the GHCR pr-<n> version deletes — GITHUB_TOKEN can publish
        # but never delete packages.
        continue-on-error: true
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-administration: write
          permission-deployments: write
          permission-packages: write
      - name: tear down surfaces for closed PRs
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: cec803d0-289b-4078-80cf-7291c16fc5ec
          GH_TOKEN: ${{ github.token }}
          # Env admin token preference order: release App → maintainer PAT
          # → GITHUB_TOKEN (never able to manage environments — last-ditch).
          GH_ADMIN_TOKEN: ${{ steps.apptok.outputs.token || secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/pr-env-sweep.sh

# Phase 1 quality gates — no production secrets (T-01-12).
# Prefer Bun via oven-sh/setup-bun; pnpm+Corepack is a documented fallback if Bun setup fails.

name: CI

on:
  push:
    # Include cursor/* so phase/integrate branches get hosted runners when
    # pull_request jobs fail to acquire runners (empty steps / runner_id 0).
    branches: [main, 'cursor/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: broken Makefile should fail before expensive jobs start.
  makefile-lint:
    name: makefile-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: makefile lint (GNU Make parse + checkmake)
        run: make makefile-lint

  api-rust:
    name: api-rust
    needs: [makefile-lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The suite is ~1650s of cumulative test time — more than the compile.
      # Partition across 3 runners so wall time tracks one third of it.
      matrix:
        shard: ["1", "2", "3"]
    steps:
      - uses: actions/checkout@v7
      - name: free disk for Rust link
        # ubuntu-latest fills quickly linking many debug integration binaries.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-debug"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: install mold linker + protoc
        # protobuf-compiler: prost-build for crates/oxidean-api/proto/runner.proto (Phase 19).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold protobuf-compiler
      - name: cargo nextest (shard ${{ matrix.shard }}/3)
        # Full-workspace debug link has hit lld bus errors (signal 7) on GHA.
        # mold + thin debuginfo (dev profile in Cargo.toml) keeps link stable/disk-safe;
        # retry once on flake.
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: |
          cargo nextest run --workspace --profile ci \
            --partition count:${{ matrix.shard }}/3 \
            || cargo nextest run --workspace --profile ci \
              --partition count:${{ matrix.shard }}/3

  web-octane:
    name: web-octane
    needs: [makefile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: web lint (oxlint type-aware + octane checks + route sync)
        run: make web-lint
      - name: web format check (oxfmt)
        run: bun run --filter @oxidean/web format:check
      - name: vitest (api-client + web unit/integration)
        run: bun run test
      - name: web build
        run: bunx turbo run build --filter=@oxidean/web

  # Dead code must not ship: knip covers the TS/.tsrx/.astro graph (custom
  # compilers in knip.ts), cargo-machete covers unused Cargo deps, and rustc's
  # dead_code lint (denied only here) covers unused Rust items.
  dead-code:
    name: dead-code
    needs: [makefile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: knip (TS/.tsrx/.astro dead code)
        run: bunx knip
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-debug"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - name: rust dead code + unused deps
        run: |
          cargo machete
          cargo clippy --workspace --all-targets -- -D warnings

  # Chromium component tests for Octane insertBefore races (happy-dom cannot catch).
  web-browser:
    name: web-browser
    needs: [makefile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: Playwright Chromium
        # Run inside apps/web so bunx resolves the declared playwright dep
        # (root bunx would fetch latest → browser-build skew vs playwright-core).
        run: cd apps/web && bunx playwright install --with-deps chromium
      - name: vitest browser (Chromium component DOM races)
        run: make test-web-browser

  # G-11.1-15 — every user-facing apps/web route page must declare happy-dom,
  # stack-browser, or documented skip evidence in the route coverage manifest.
  # Change-aware: newly added / modified routes cannot stay skip-only.
  route-coverage:
    name: route-coverage
    needs: [makefile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: route coverage gate (inventory + change-aware)
        env:
          # PR: compare to PR base. Push: origin/main (github.event.before breaks after force-push rewrites).
          UI_COVERAGE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
          else
            git fetch --no-tags origin main
          fi
          make route-coverage-check

  # High-risk interactive UI (Checkbox / Radio / Select / Switch / portals /
  # form.Subscribe) must prove Chromium coverage via *.browser.test.tsx,
  # stack-browser, or documented skip. Change-aware: newly added / modified
  # high-risk surfaces cannot stay skip-only.
  browser-coverage:
    name: browser-coverage
    needs: [makefile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: browser coverage gate (inventory + change-aware)
        env:
          # PR: compare to PR base. Push: origin/main (github.event.before breaks after force-push rewrites).
          UI_COVERAGE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
          else
            git fetch --no-tags origin main
          fi
          make browser-coverage-check
          ./scripts/ui-coverage-change.contract.sh

  # D-QH-02 weighted coverage gate (unit 25% / integration 40% / e2e checklist 35%).
  # Rust cargo-llvm-cov collects var/coverage/rust-* (uploaded as artifacts);
  # web Vitest + interim e2e checklist drive the score.
  coverage-weighted:
    name: coverage-weighted
    needs: [makefile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: free disk for Rust coverage build
        # Instrumented workspace build has the same disk pressure as api-rust.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          # Instrumented artifacts differ from the debug-build jobs' — keep a
          # separate cache entry so the two don't evict each other's fingerprints.
          shared-key: "rust-cov"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest
      - name: install mold linker + protoc
        # protobuf-compiler: prost-build for crates/oxidean-api/proto/runner.proto.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold protobuf-compiler
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: aggregator contract
        run: make coverage-contract
      - name: collect rust coverage (cargo-llvm-cov)
        # Same link/disk stability env as api-rust. Collection only — the
        # weighted gate composition (25/40/35) does not consume these numbers.
        env:
          CARGO_INCREMENTAL: "0"
          NEXTEST_PROFILE: "ci"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: make coverage-rust
      - name: collect web coverage + weighted gate
        env:
          COVERAGE_WEIGHTED_FLOOR: "0.70"
        run: |
          make coverage-web
          ./scripts/coverage-e2e-checklist.sh | tee var/coverage/e2e-checklist.txt
          ./scripts/coverage-weighted.sh \
            --unit-json var/coverage/web-unit-summary.json \
            --integration-json var/coverage/web-integration-summary.json \
            --e2e-checklist | tee var/coverage/weighted.txt
      - name: upload rust coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rust
          path: var/coverage/rust-*
          if-no-files-found: ignore
      - name: upload coverage artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-weighted-logs
          path: |
            var/coverage/
            apps/web/coverage/
          if-no-files-found: ignore

  e2e-stack:
    name: e2e-stack
    needs: [makefile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-debug"
      - name: install protoc + mold
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler mold
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: Playwright Chromium (stack browser e2e)
        # See web-browser job: run inside apps/web to use the locked version.
        run: cd apps/web && bunx playwright install --with-deps chromium
      - name: stack e2e (API + Mailpit/OIDC/stubs + web)
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: make test-e2e-stack
      - name: upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-stack-logs
          path: |
            var/e2e/
            apps/web/.vitest/attachments/
          if-no-files-found: ignore

  # Actions pipeline e2e: API (sqlite) + native oxidean-runner (host mode,
  # no Docker) + seeded push-triggered workflow → green run with log marker.
  actions-e2e:
    name: actions-e2e
    needs: [makefile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: free disk for Rust link
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-debug"
      - name: install protoc + mold
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler mold jq
      - name: pipeline e2e
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: ./scripts/e2e-actions-pipeline.sh

  rpc-sync:
    name: rpc-sync
    needs: [makefile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-debug"
      - name: install protoc + mold
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler mold
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: check-rpc-sync
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: make rpc-sync-check
      - name: check-openapi-sync
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: make openapi-sync-check

  compose:
    name: compose
    needs: [makefile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: docker compose -f docker-compose.yml config
      - name: docker compose mysql overlay config
        run: docker compose -f docker-compose.yml -f docker-compose.mysql.yml --profile mysql config
      - name: docker compose sqlite overlay config
        run: docker compose -f docker-compose.yml -f docker-compose.sqlite.yml config
      - name: docker compose dev-auth stubs config
        run: docker compose -f docker-compose.dev-auth.yml --profile dev-auth config

  # api+web image build for same-run consumers + cross-run gha layer cache.
  # Consumers download the artifact and bring the stack up without --build.
  docker-ci-images:
    name: docker-ci-images
    needs: [makefile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: free disk for compose image builds
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift || true
          df -h /
      - uses: docker/setup-buildx-action@v4
      # cargo-chef dep layer exports via type=gha (mode=max keeps intermediate
      # stages), so the Rust deps only rebuild when Cargo.lock moves.
      - name: build api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/oxidean-api/Dockerfile
          load: true
          tags: oxidean-api:ci
          cache-from: type=gha,scope=oxidean-api
          cache-to: type=gha,mode=max,scope=oxidean-api
      - name: build runner image (compile gate)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/oxidean-runner/Dockerfile
          push: false
          cache-from: type=gha,scope=oxidean-runner
          cache-to: type=gha,mode=max,scope=oxidean-runner
      - name: build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: oxidean-web:ci
          cache-from: type=gha,scope=oxidean-web
          cache-to: type=gha,mode=max,scope=oxidean-web
      - name: export images tarball
        run: |
          docker save oxidean-api:ci oxidean-web:ci | gzip -1 > /tmp/oxidean-ci-images.tgz
          ls -lh /tmp/oxidean-ci-images.tgz
      - name: upload compose images (same-run only)
        uses: actions/upload-artifact@v7
        with:
          name: oxidean-ci-images
          path: /tmp/oxidean-ci-images.tgz
          retention-days: 1
          if-no-files-found: error

  # D-CI-01…04: Compose bring-up health (/ + /health + system.db_probe).
  # Reuses make smoke* → scripts/compose-smoke.sh. Kept separate from smoke-protocol (D-CI-05).
  # Images come from docker-ci-images (same-run artifact); no per-leg rebuild (D-CI-06).
  # Matrix legs: postgres (D-CI-01) + sqlite (D-CI-02) + mysql (D-CI-03).
  compose-smoke:
    name: compose-smoke (${{ matrix.dialect }})
    needs: [docker-ci-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, sqlite, mysql]
    steps:
      - uses: actions/checkout@v7
      - name: free disk for compose image load
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift || true
          df -h /
      - name: download compose images
        uses: actions/download-artifact@v8
        with:
          name: oxidean-ci-images
          path: /tmp/oxidean-ci-images
      - name: load compose images
        run: ./scripts/ci-load-compose-images.sh /tmp/oxidean-ci-images/oxidean-ci-images.tgz
      - name: Compose bring-up smoke (${{ matrix.dialect }})
        env:
          CI: "true"
          SMOKE_REQUIRE_STACK: "1"
          OXIDEAN_COMPOSE_SKIP_BUILD: "1"
        run: ./scripts/ci-compose-smoke.sh ${{ matrix.dialect }}
      - name: upload compose smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-smoke-${{ matrix.dialect }}-logs
          path: |
            /tmp/oxidean-smoke*.json
          if-no-files-found: ignore

  # D-QH-04: forge protocol smokes (Smart HTTP, SSH TCP, LFS routing, packages PathPrefix).
  # DEBT-01: also runs smoke-protection — ORG-06/D-PKG-03 protected-push denial on a
  # fresh stack it re-ups itself (wipes volumes; HTTPS denial mandatory, SSH half skipped).
  # Fail-closed — docker-missing / stack-down must not greenwash (T-11.1-40).
  # DEBT-11: ci-smoke-protocol.sh seeds a verified owner + public repo + PAT +
  # session via RPC, so HTTPS/SSH smokes run real ls-remote/push
  # (SMOKE_SEED_FIXTURES=0 restores routing/TCP-only). git-lfs stays opt-in.
  smoke-protocol:
    name: smoke-protocol
    needs: [docker-ci-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: free disk for compose image load
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift || true
          df -h /
      - name: download compose images
        uses: actions/download-artifact@v8
        with:
          name: oxidean-ci-images
          path: /tmp/oxidean-ci-images
      - name: load compose images
        run: ./scripts/ci-load-compose-images.sh /tmp/oxidean-ci-images/oxidean-ci-images.tgz
      - name: forge protocol smokes
        env:
          CI: "true"
          SMOKE_REQUIRE_STACK: "1"
          SMOKE_SKIP_LFS_CLIENT: "1"
          OXIDEAN_COMPOSE_SKIP_BUILD: "1"
        run: make smoke-protocol-ci # smoke-git-https smoke-git-ssh smoke-git-lfs smoke-packages smoke-protection
      - name: upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-protocol-logs
          path: |
            /tmp/oxidean-smoke*.json
          if-no-files-found: ignore

  # Both Postgres and MySQL service containers boot on every matrix leg because
  # GitHub Actions cannot condition `services:` on `matrix.*`. Accepted cost on the sqlite leg.
  db-matrix:
    name: db-${{ matrix.dialect }}
    needs: [makefile-lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: postgres
            database_url: postgres://oxidean:oxidean@localhost:5432/oxidean
          - dialect: mysql
            database_url: mysql://oxidean:oxidean@127.0.0.1:3306/oxidean
          - dialect: sqlite
            database_url: sqlite:./var/oxidean.db
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oxidean
          POSTGRES_PASSWORD: oxidean
          POSTGRES_DB: oxidean
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U oxidean" --health-interval=5s --health-timeout=5s --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: oxidean
          MYSQL_PASSWORD: oxidean
          MYSQL_DATABASE: oxidean
          MYSQL_ROOT_PASSWORD: oxidean
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -poxidean" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-debug"
      - name: install mold
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold
      - name: migrate + probe (${{ matrix.dialect }})
        env:
          DATABASE_URL: ${{ matrix.database_url }}
          OXIDEAN_DB_DIALECT: ${{ matrix.dialect }}
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo test -p oxidean-db --test dialect_probe -- --nocapture

  # Release-build evidence: `cargo build --timings` HTML + binary size, so build
  # performance changes are measurable on the PR that makes them. Runs on pushes
  # to main (baseline) and PRs that touch Rust-relevant files.
  build-metrics:
    name: build-metrics
    needs: [makefile-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gate to Rust-affecting changes
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            git fetch --no-tags origin main
            BASE="origin/main"
          fi
          # Push events always run (baseline data). PRs run only when the diff
          # touches Rust manifests, crates, CI, or image build inputs.
          if [ "${{ github.event_name }}" != "pull_request" ] \
            || git diff --name-only "$BASE"...HEAD \
               | grep -qE '^(Cargo\.(toml|lock)|crates/|\.github/workflows/|\.dockerignore|.*Dockerfile)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Rust-affecting changes — skipping release metrics build."
          fi
      - name: free disk for release build
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.run == 'true'
        with:
          shared-key: "rust-release"
      - name: install mold + protoc + time
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold protobuf-compiler time
      - name: cargo build --release --timings
        if: steps.gate.outputs.run == 'true'
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: |
          /usr/bin/time -v cargo build --release --timings \
            -p oxidean-api --bin oxidean-api --bin oxidean-protection-hook 2>&1 \
            | grep -E "Elapsed|Maximum resident|Finished" || true
      - name: report sizes + dep count
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "## Build metrics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| artifact | size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for bin in oxidean-api oxidean-protection-hook; do
            BYTES=$(stat -c%s "target/release/$bin")
            HUMAN=$(ls -lh "target/release/$bin" | awk '{print $5}')
            echo "| \`$bin\` | $HUMAN ($BYTES B) |" >> "$GITHUB_STEP_SUMMARY"
          done
          DEPS=$(cargo tree -p oxidean-api --prefix none 2>/dev/null | sort -u | wc -l)
          echo "| dep tree (oxidean-api) | $DEPS crates |" >> "$GITHUB_STEP_SUMMARY"
          ls -lh target/release/oxidean-api target/release/oxidean-protection-hook
      - name: upload cargo timings
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings
          path: target/cargo-timings/
          if-no-files-found: ignore

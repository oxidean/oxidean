# Automated release PR (FR8.2, WF-5).
#
# Manual dispatch (or the weekly cron) computes the BumpPlan, writes component
# + root changelogs, applies the version bumps, and opens a
# `chore(release):` PR from a `release/*` branch. Merging that PR and pushing
# the resulting `*-v*` tags with RELEASE_TOKEN cuts the releases.
#
# The bot commit uses the reserved `release` scope, so it never feeds bump
# evidence back into the next plan (BR2.3).

name: Release PR

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [stable, alpha, beta, nightly]
        default: stable
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: open chore(release) PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: install workspace deps
        run: bun install --frozen-lockfile
      - name: compute plan
        id: plan
        env:
          CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          set -euo pipefail
          bun scripts/versioning/cli.ts plan --channel "$CHANNEL" --json > /tmp/plan.json
          jq -r '.entries[] | "\(.component) \(.fromVersion) -> \(.toVersion) (\(.bump))"' /tmp/plan.json
          bumped="$(jq '[.entries[] | select(.fromVersion != .toVersion)] | length' /tmp/plan.json)"
          echo "bumped=$bumped" >> "$GITHUB_OUTPUT"
      - name: nothing to release
        if: steps.plan.outputs.bumped == '0'
        run: echo "plan is empty — no release PR needed"
      - name: changelog + bump
        if: steps.plan.outputs.bumped != '0'
        env:
          CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          set -euo pipefail
          bun scripts/versioning/cli.ts changelog --channel "$CHANNEL"
          bun scripts/versioning/cli.ts bump --channel "$CHANNEL"
      - name: push release branch + open PR
        if: steps.plan.outputs.bumped != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release/${CHANNEL}-$(date -u +%Y%m%d)"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore(release): cut ${CHANNEL} release"
          git push origin "HEAD:$branch" --force-with-lease
          summary="$(jq -r '.entries[] | select(.fromVersion != .toVersion) | "- `\(.component)` \(.fromVersion) → \(.toVersion)"' /tmp/plan.json)"
          printf '## Release plan (%s)\n\n%s\n\nAfter merge, push the component tags with `RELEASE_TOKEN`:\n`bun scripts/versioning/cli.ts release-tags` then push each `<component>-v<ver>` tag.\n' \
            "$CHANNEL" "$summary" > /tmp/pr-body.md
          gh pr create --base main --head "$branch" \
            --title "chore(release): ${CHANNEL} release $(date -u +%Y-%m-%d)" \
            --body-file /tmp/pr-body.md

# Manual promote / rollback for Railway production (api, web, runner,
# gateway). Deploys pin each service's source.image to the GHCR sha-<sha>
# tag set built by images.yml — Railway pulls images, never builds. Does not
# Sync environments or mutate variables except the api CLI-feed pin; rollback
# restores the previous canRollback deployment (and its image ref) per service.
#
# Setup (once per repo):
#   1. Reuse GitHub Environment `Oxidean / production` (or create it)
#   2. Add secret RAILWAY_TOKEN — a Railway *project token* scoped to the
#      production environment (sent via the Project-Access-Token header).
#      An account/workspace token works too if set as RAILWAY_API_TOKEN.
#   3. Optional: enable required reviewers on the environment
#
# Run: Actions → Production deploy → Run workflow

name: Production deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: promote a commit, or rollback each service
        required: true
        type: choice
        options:
          - promote
          - rollback
        default: promote
      commit_sha:
        description: Commit SHA to promote (empty = origin/main HEAD). Ignored for rollback.
        required: false
        type: string
        default: ""
      dry_run:
        description: Plan only — no Railway deploys, rollbacks, or health probe
        required: true
        type: boolean
        default: false
      cut_release:
        description: Cut the stable release on promote (changelog + bump + tags). Rollback never cuts.
        required: false
        type: boolean
        default: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write # the stable cut pushes the bump commit + tags via RELEASE_TOKEN
  actions: read
  packages: write # promote moves the :production channel tag on GHCR
  deployments: write # image deploys post GitHub Deployment records (Railway only posts git-triggered ones)

jobs:
  deploy:
    name: ${{ inputs.action }}${{ inputs.dry_run && ' (dry-run)' || '' }} production
    runs-on: ubuntu-latest
    environment: Oxidean / production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: cec803d0-289b-4078-80cf-7291c16fc5ec
      RAILWAY_ENVIRONMENT_ID: b1c33c22-90ce-433b-99f6-864656512115
      RAILWAY_SERVICE_API_ID: 19bf0a47-2fdf-4130-b6b0-858de92cb858
      RAILWAY_SERVICE_WEB_ID: 26b7e1b6-6cfa-4c7e-942a-bed8e5ce12a2
      RAILWAY_SERVICE_RUNNER_ID: 36f9b50a-738a-419a-9171-49f56c902e6a
      RAILWAY_SERVICE_GATEWAY_ID: 864fa81c-6e5d-4939-b33b-85eb435365ac
      OXIDEAN_PRODUCTION_HEALTH_URL: https://app.oxidean.dev/health
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # RELEASE_TOKEN (maintainer PAT): the stable cut pushes the bump
          # commit to main and pushes the *-v* tags — GITHUB_TOKEN pushes are
          # recursion-blocked and would never fire the release lanes.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Require RAILWAY_TOKEN
        run: |
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "RAILWAY_TOKEN is not set on the GitHub Environment \`Oxidean / production\`." >&2
            exit 1
          fi

      - name: Resolve promote SHA
        id: sha
        if: inputs.action == 'promote'
        run: |
          set -euo pipefail
          INPUT="${{ inputs.commit_sha }}"
          if [[ -z "${INPUT// }" ]]; then
            SHA="$(git rev-parse origin/main)"
            echo "Using origin/main HEAD: ${SHA}"
          else
            SHA="$(git rev-parse "${INPUT}^{commit}")"
            echo "Using input commit: ${SHA}"
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Refuse: ${SHA} is not an ancestor of origin/main" >&2
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Require CI success on SHA
        if: inputs.action == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          RUNS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=30" \
            --jq '[.workflow_runs[] | select(.name=="CI") | {id,status,conclusion,html_url}]')"
          echo "$RUNS_JSON" | jq .
          COUNT="$(echo "$RUNS_JSON" | jq 'length')"
          if [[ "$COUNT" == "0" ]]; then
            echo "No CI workflow runs found for ${SHA}" >&2
            exit 1
          fi
          # Newest CI run must be completed successfully.
          STATUS="$(echo "$RUNS_JSON" | jq -r '.[0].status')"
          CONCLUSION="$(echo "$RUNS_JSON" | jq -r '.[0].conclusion // empty')"
          if [[ "$STATUS" != "completed" || "$CONCLUSION" != "success" ]]; then
            echo "Latest CI run for ${SHA} is status=${STATUS} conclusion=${CONCLUSION}" >&2
            exit 1
          fi
          echo "CI success confirmed for ${SHA}"

      # ── stable release cut: the promote is the release event ────────────
      # main is the beta channel (release-beta.yml tags prereleases on every
      # push). The stable version bump is created here, on the production
      # deploy, so the shipped artifact self-reports its released version:
      # plan → changelog → bump → `chore(release):` commit → tags → deploy the
      # bump commit. First-ever cut (no stable *-vX.Y.Z tag anywhere) is the
      # 0.1.0 baseline for every component instead.

      - uses: oven-sh/setup-bun@v2
        if: inputs.action == 'promote' && inputs.cut_release

      - uses: dtolnay/rust-toolchain@stable
        if: inputs.action == 'promote' && inputs.cut_release && !inputs.dry_run

      - name: RELEASE_TOKEN is configured
        if: inputs.action == 'promote' && inputs.cut_release && !inputs.dry_run
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::error::RELEASE_TOKEN secret is not set — the stable cut pushes commits + tags (FR3.4)"
            exit 1
          fi

      - name: Compute stable release plan at the promoted SHA
        id: cut
        if: inputs.action == 'promote' && inputs.cut_release
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          git checkout "$SHA"
          bun install --frozen-lockfile
          bun scripts/versioning/cli.ts plan --channel stable --json > /tmp/stable-plan.json
          jq -r '.entries[] | "\(.component) \(.fromVersion) -> \(.toVersion) (\(.bump))"' /tmp/stable-plan.json
          bumped="$(jq '[.entries[] | select(.fromVersion != .toVersion)] | length' /tmp/stable-plan.json)"
          stable_tags="$(git tag -l | grep -cE -- '-v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          echo "bumped=$bumped" >> "$GITHUB_OUTPUT"
          echo "baseline=$([ "$stable_tags" = "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Baseline cut — every component at its carrier version
        id: baseline
        if: inputs.action == 'promote' && inputs.cut_release && !inputs.dry_run && steps.cut.outputs.baseline == 'true'
        run: |
          set -euo pipefail
          # Annotated tags need a committer identity — the baseline path makes
          # no commits, so nothing else configures one.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_tags="$(git ls-remote --tags origin | awk '{print $2}' | sed 's|refs/tags/||' | sort)"
          bun scripts/versioning/cli.ts release-tags --all
          NEW="$(comm -13 <(echo "$remote_tags") <(git tag -l | sort))"
          for t in $NEW; do git push origin "$t"; done
          if echo "$NEW" | grep -qE '^ox-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "wait_ox=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stable cut — changelog + bump + tags on the bump commit
        id: bump
        if: inputs.action == 'promote' && inputs.cut_release && !inputs.dry_run && steps.cut.outputs.baseline == 'false' && steps.cut.outputs.bumped != '0'
        run: |
          set -euo pipefail
          # One plan drives the whole cut — re-running plan after bump would
          # read the bumped carriers as fromVersion and double-bump.
          bun scripts/versioning/cli.ts changelog --plan /tmp/stable-plan.json
          bun scripts/versioning/cli.ts bump --plan /tmp/stable-plan.json
          # WIRE_VERSION is embedded into the generated api-client + OpenAPI
          # spec — regen so the bump commit doesn't fail rpc-sync on its own CI.
          make rpc-gen openapi-gen
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): cut stable release"
          # Fast-forward only: if main moved since the promoted SHA, fail —
          # the operator re-runs the promote (the plan is computed fresh).
          git push origin "HEAD:main"
          remote_tags="$(git ls-remote --tags origin | awk '{print $2}' | sed 's|refs/tags/||' | sort)"
          bun scripts/versioning/cli.ts release-tags --plan /tmp/stable-plan.json
          NEW="$(comm -13 <(echo "$remote_tags") <(git tag -l | sort))"
          for t in $NEW; do git push origin "$t"; done
          if echo "$NEW" | grep -qE '^ox-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "wait_ox=true" >> "$GITHUB_OUTPUT"
          fi
          echo "deploy_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve deploy SHA
        id: deploy
        if: inputs.action == 'promote'
        env:
          PROMOTED: ${{ steps.sha.outputs.sha }}
          BUMPED: ${{ steps.bump.outputs.deploy_sha }}
          WAIT: ${{ steps.bump.outputs.wait_ox }}${{ steps.baseline.outputs.wait_ox }}
        run: |
          set -euo pipefail
          echo "sha=${BUMPED:-$PROMOTED}" >> "$GITHUB_OUTPUT"
          if [[ "$WAIT" == *true* ]]; then
            echo "wait_ox=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for ox release assets
        if: inputs.action == 'promote' && steps.deploy.outputs.wait_ox == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.deploy.outputs.sha }}
        run: |
          set -euo pipefail
          # A stable ox-v* tag was just pushed — its ox-cli.yml matrix must land
          # the release assets before the api container's boot-time
          # OXIDEAN_CLI_DIST_URL fetch runs, or the new replica fails closed.
          for i in $(seq 1 90); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=50" \
              --jq '[.workflow_runs[] | select(.path | endswith("ox-cli.yml"))][0].status // "queued"')"
            if [ "$status" = "completed" ]; then
              concl="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=50" \
                --jq '[.workflow_runs[] | select(.path | endswith("ox-cli.yml"))][0].conclusion // empty')"
              if [ "$concl" = "success" ]; then
                echo "ox-cli run succeeded — release assets are live"
                exit 0
              fi
              echo "::error::ox-cli run concluded ${concl:-unknown} — refusing to deploy an api image that cannot fetch CLI assets"
              exit 1
            fi
            echo "waiting for ox-cli asset matrix on ${SHA} (status: $status)"
            sleep 30
          done
          echo "::error::timed out (45m) waiting for ox-cli release assets"
          exit 1

      - name: Wait for GHCR image tags
        if: inputs.action == 'promote' && !inputs.dry_run
        env:
          GHCR_TOKEN: ${{ github.token }}
          SHA: ${{ steps.deploy.outputs.sha }}
        run: |
          set -euo pipefail
          # images.yml publishes the all-or-nothing sha-<sha> set on every
          # main push — including the stable cut's `chore(release):` bump
          # commit (a seconds-long release-layer retag there, a full build
          # otherwise). Bounded wait covers both.
          scripts/ghcr-images.sh wait "sha-${SHA}" --timeout 2700

      - name: login to GHCR (production channel retag)
        if: inputs.action == 'promote' && !inputs.dry_run
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote
        if: inputs.action == 'promote'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          # Deploy the bump commit when a stable cut ran, else the promoted SHA.
          SHA: ${{ steps.deploy.outputs.sha || steps.sha.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(promote "$SHA")
          dep_id=""
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
            echo "dry_run=true — no Railway mutations"
          else
            # Railway posts no Deployment record for image repins — keep the
            # same signal the env's git-triggered history had.
            dep_id="$(scripts/github-deployment.sh create \
              --ref "$SHA" --environment "Oxidean / production" \
              --production \
              --description "promote sha-${SHA}")"
            scripts/github-deployment.sh status "$dep_id" in_progress \
              --url "https://app.oxidean.dev" --description "promoting sha-${SHA}"
          fi
          if bash scripts/railway-production-deploy.sh "${args[@]}"; then
            scripts/github-deployment.sh status "${dep_id:-}" success \
              --url "https://app.oxidean.dev" --description "deployed sha-${SHA}"
          else
            scripts/github-deployment.sh status "${dep_id:-}" failure \
              --url "https://app.oxidean.dev" --description "promote sha-${SHA} failed"
            exit 1
          fi

      - name: Rollback
        if: inputs.action == 'rollback'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(rollback)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
            echo "dry_run=true — no Railway mutations"
          fi
          bash scripts/railway-production-deploy.sh "${args[@]}"

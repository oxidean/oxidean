name: docs site release

on:
  push:
    tags:
      - "ox-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the docs bundle to (e.g. ox-v0.4.2)
        required: true
        type: string

jobs:
  pack:
    permissions:
      contents: write
    uses: oxidean/docs-manifest/.github/workflows/release.yml@v0.1.2
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      product: oxidean
    secrets:
      site_dispatch_token: ${{ secrets.DOCS_SITE_DISPATCH_TOKEN }}

# Publish the official oxidean-runner image to GHCR.
#
# Triggers:
#   - push to main touching the runner crate or its Dockerfile (tag: main)
#   - tags oxidean-runner-v*.*.* (tag: component-prefixed semver)
#   - manual dispatch (tag: latest + sha)
#
# The GitHub Release for oxidean-runner-v* tags is created by the generic
# lane in release.yml — this workflow publishes the image only.
#
# PRs that touch the runner get a compile-only build check instead — see
# docker-ci-images in ci.yml.

name: Publish runner image

on:
  push:
    branches: [main]
    paths:
      - crates/oxidean-runner/**
      - docker/oxidean-runner/**
      - Cargo.lock
      - .github/workflows/publish-runner.yml
    tags: ["oxidean-runner-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ghcr.io/${{ github.repository_owner }}/oxidean-runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift || true
      - uses: docker/setup-buildx-action@v4
      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: strip component prefix from tag
        id: ver
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "semver=${GITHUB_REF_NAME#oxidean-runner-v}" >> "$GITHUB_OUTPUT"
      - name: image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/oxidean-runner
          tags: |
            type=ref,event=branch
            type=raw,value=${{ steps.ver.outputs.semver }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: build + push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/oxidean-runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=oxidean-runner
          cache-to: type=gha,mode=max,scope=oxidean-runner

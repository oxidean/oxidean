# Beta channel: every merge to main cuts prerelease tags.
#
# `main` is the beta channel — images.yml already deploys it to staging.
# This
# lane is bookkeeping: on each push it computes the beta BumpPlan and, when
# anything bumped, creates annotated `<component>-v<semver>-beta.N` tags at the
# pushed SHA and pushes them as the release App (GITHUB_TOKEN tag pushes do
# not re-trigger workflows — FR3.4).
#
# Tag-only: manifests on main always carry the last stable version. Pushed
# beta tags fire the normal tag lanes — release.yml creates prerelease-marked
# Releases, ox-cli.yml builds the full matrix for `ox-v*-beta.*` (never
# latest.json — C5), images.yml ships prerelease service images (never
# :latest).
#
# Stable cuts do NOT live here — the Production deploy promote job creates
# the stable version bump (changelog + bump + tags) before deploying.
#
# No recursion: the `chore(release):` bump commit pushed by the promote job
# triggers this lane, but its beta plan is empty — the new stable tag is the
# bound and the release commit is scope-exempt.

name: Release beta

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC — catch-up if a push lane was skipped

concurrency:
  group: release-beta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  beta-tags:
    name: cut beta tags
    runs-on: ubuntu-latest
    # Forks have no release App credentials and should never cut releases.
    if: github.repository == 'oxidean/oxidean'
    steps:
      # Tag pushes must come from the release App so the push event re-triggers
      # the tag lanes — the same mint production-deploy.yml uses (FR3.4). The
      # legacy RELEASE_TOKEN PAT is gone; App installation tokens cascade.
      - name: Release App credentials are configured
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${RELEASE_APP_ID:-}" ] || [ -z "${RELEASE_APP_PRIVATE_KEY:-}" ]; then
            echo "::error::RELEASE_APP_ID (variable) and RELEASE_APP_PRIVATE_KEY (secret) must be set — beta tags push as the release App (FR3.4)"
            exit 1
          fi

      - name: Mint release App token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}
          # Tag the pushed/selected SHA, not wherever main happens to be when
          # this serialized job starts.
          ref: ${{ github.sha }}

      - name: Commit as the release App
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.release-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # Annotated tags need a committer identity — attribute them to the
          # App's bot user. Falls back to the generic Actions bot if the
          # lookup fails (identity only; the push credential is unaffected).
          bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id 2>/dev/null || true)"
          if [ -n "$bot_id" ]; then
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

      - uses: oven-sh/setup-bun@v2
      - name: install workspace deps
        run: bun install --frozen-lockfile
      - name: fetch tags (plan bounds + existing-tag dedup need them)
        run: git fetch --tags --force origin
      - name: compute beta plan
        id: plan
        run: |
          set -euo pipefail
          bun scripts/versioning/cli.ts plan --channel beta --json > /tmp/plan.json
          jq -r '.entries[] | "\(.component) \(.fromVersion) -> \(.toVersion) (\(.bump))"' /tmp/plan.json
          bumped="$(jq '[.entries[] | select(.fromVersion != .toVersion)] | length' /tmp/plan.json)"
          echo "bumped=$bumped" >> "$GITHUB_OUTPUT"
      - name: nothing to release
        if: steps.plan.outputs.bumped == '0'
        run: echo "beta plan is empty — no prerelease cut"
      - name: tag + push beta cuts as the release App
        if: steps.plan.outputs.bumped != '0'
        run: |
          set -euo pipefail
          # Tag pushes ride the App-token credentials persisted by checkout;
          # committer identity was configured above.
          remote_tags="$(git ls-remote --tags origin | awk '{print $2}' | sed 's|refs/tags/||' | sort)"
          bun scripts/versioning/cli.ts release-tags --channel beta
          # One atomic push — per-tag loops race GitHub's ref backend and come
          # back `remote: fatal error in commit_refs`, leaving a partially-cut
          # release (run 39315353804 pushed 6/8 tags before the rejection).
          NEW="$(comm -13 <(echo "$remote_tags") <(git tag -l | sort))"
          # shellcheck disable=SC2086 # tag names can't contain spaces — word-split intended
          scripts/push-tags.sh $NEW

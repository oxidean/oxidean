# Optional MySQL stack (D-07). Usage:
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml --profile mysql up --build
# Default postgres still starts unless you stop it; api DATABASE_URL is overridden to MySQL.

services:
  mysql:
    profiles: ["mysql"]
    image: mysql:26.7
    environment:
      MYSQL_USER: ${MYSQL_USER:-oxidean}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-oxidean}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oxidean}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-oxidean}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-oxidean}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - oxidean

  api:
    environment:
      DATABASE_URL: ${MYSQL_DATABASE_URL:-mysql://oxidean:oxidean@mysql:3306/oxidean}
      OXIDEAN_DB_DIALECT: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:

# cross container images — pin to :main.
# cross 0.2.5 defaults to its version-tagged images (<target>:0.2.5), which are
# Ubuntu 16.04/18.04-era bases (glibc 2.23–2.27). Host build scripts compiled
# by current rustc require glibc >= 2.28, so aarch64-musl and armv7 builds fail
# inside them with "weak version `GLIBC_2.28' not found". The :main images are
# Ubuntu 24.04 (glibc 2.39) and work.

[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:main"

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:main"

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:main"

# aarch64-gnu uses the hosted arm runner in CI, but pinning it here too keeps
# local `cross build --target aarch64-unknown-linux-gnu` on a modern toolchain.
[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"

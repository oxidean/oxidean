[package]
name = "oxidean-runner"
description = "Oxidean Actions self-hosted runner (custom JSON protocol)"
edition.workspace = true
license.workspace = true
version = "0.2.0"

[[bin]]
name = "oxidean-runner"
path = "src/main.rs"

[dependencies]
oxidean-actions-expr = { path = "../oxidean-actions-expr" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
sha2 = "0.11.0"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
  "charset",
  "http2",
  "system-proxy",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.23"
serde_yaml = "0.9"
regex = "1.11"

[dev-dependencies]
tempfile = "3"

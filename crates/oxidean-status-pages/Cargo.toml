[package]
name = "oxidean-status-pages"
description = "Branded HTTP status pages shared by the oxidean-web and oxidean-api serving tiers"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
http = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }

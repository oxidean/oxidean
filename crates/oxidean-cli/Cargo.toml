[package]
name = "oxidean-cli"
description = "ox — companion CLI for Oxidean forge instances (typed /api/rpc client)"
version = "0.3.1"
edition.workspace = true
license.workspace = true

[lib]
name = "oxidean_cli"
path = "src/lib.rs"

[[bin]]
name = "ox"
path = "src/main.rs"

[dependencies]
oxidean-core = { path = "../oxidean-core" }
# `ox vcs` logic lives in the shared VCS crate; the `client` feature (its
# default) keeps this dependency free of oxidean-db/oxidean-git/sqlx (ADR-011).
oxidean-vcs = { path = "../oxidean-vcs", features = ["client"] }
async-trait = { version = "0.1.92" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.13.5", features = ["rustls", "json", "multipart"], default-features = false }
sha2 = "0.11.1"
thiserror = "2"
anstyle = "1.0.14"
dialoguer = "0.12.0"
indicatif = "0.18.6"
jaq-core = "3.1.2"
termimad = "0.35.5"
keyring = "4.2.0"
jaq-std = "3.0.4"
jaq-json = { version = "2.0.3", features = ["serde"] }
# `ox pilot connect` connector: fs payloads ride base64 on the wire; key
# material and verifier bytes are zeroized on drop (BR2.4).
base64 = "0.22.1"
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
# `ox pilot run` — process-group kill on exec cancel + `gethostname` for the
# pair default label; unix-only so the Windows build stays libc-free.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
hex = "0.4"
wiremock = "0.6.5"

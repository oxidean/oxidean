[package]
name = "oxidean-vcs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# `client` (default) stays dependency-free; `server` gates the object store
# (oxidean-db + fs/streaming deps). Host crates opt in via `features = ["server"]`.
[features]
default = ["client"]
client = []
server = [
    "dep:bytes",
    "dep:chrono",
    "dep:futures-util",
    "dep:oxidean-db",
    "dep:sha2",
    "dep:tokio",
    "dep:tracing",
]

[dependencies]
bytes = { version = "1", optional = true }
chrono = { version = "0.4.45", optional = true }
futures-util = { version = "0.3", optional = true }
oxidean-db = { path = "../oxidean-db", optional = true }
sha2 = { version = "0.11", optional = true }
tokio = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
# test fixtures: real sqlite `Database` (migrations run by the test) and the
# repo-seeding facade path needs `oxidean_core::Role`.
oxidean-core = { path = "../oxidean-core" }
tempfile = "3"

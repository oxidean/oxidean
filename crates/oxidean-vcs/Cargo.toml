[package]
name = "oxidean-vcs"
version = "0.2.1"
edition.workspace = true
license.workspace = true

# `client` (default) carries the shared wire DTOs (`oxidean-core` — already an
# `oxidean-cli` dep), the injected `VcsTransport` seam, the `ox vcs` CliSurface
# and the working-copy machinery — zero `oxidean-db`/`oxidean-git`/sqlx edges
# (ADR-011, BR3.1). `server` gates the object store (oxidean-db + fs/streaming
# deps) and the changeset/ref/read-index stores. Host crates opt in via
# `features = ["server"]`.
[features]
default = ["client"]
client = []
server = [
    "dep:bytes",
    "dep:chrono",
    "dep:futures-util",
    "dep:oxidean-db",
    "dep:oxidean-git",
    "dep:tokio",
    "dep:tracing",
]

[dependencies]
async-trait = { version = "0.1.92" }
base64 = { version = "0.23" }
hex = { version = "0.4" }
oxidean-core = { path = "../oxidean-core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "0.11" }

# --- server-gated ---
bytes = { version = "1", optional = true }
chrono = { version = "0.4.45", optional = true }
futures-util = { version = "0.3", optional = true }
oxidean-db = { path = "../oxidean-db", optional = true }
oxidean-git = { path = "../oxidean-git", optional = true }
tokio = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }

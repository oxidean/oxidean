[package]
name = "oxidean-vcs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# `client` (default) stays dependency-free; `server` gates the object store
# (oxidean-db + fs/streaming deps) and the changeset/ref/read-index stores.
# Host crates opt in via `features = ["server"]`.
[features]
default = ["client"]
client = []
server = [
    "dep:base64",
    "dep:bytes",
    "dep:chrono",
    "dep:futures-util",
    "dep:hex",
    "dep:oxidean-core",
    "dep:oxidean-db",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tokio",
    "dep:tracing",
]

[dependencies]
base64 = { version = "0.23", optional = true }
bytes = { version = "1", optional = true }
chrono = { version = "0.4.45", optional = true }
futures-util = { version = "0.3", optional = true }
hex = { version = "0.4", optional = true }
oxidean-core = { path = "../oxidean-core", optional = true }
oxidean-db = { path = "../oxidean-db", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.11", optional = true }
tokio = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"

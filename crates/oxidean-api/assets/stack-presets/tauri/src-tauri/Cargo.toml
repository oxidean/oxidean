[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

# Embedded template asset — standalone manifest, not a workspace member.
[workspace]

# Template asset: deps are consumed by generated projects, not this repo.
[package.metadata.cargo-machete]
ignored = ["serde", "serde_json", "tauri-build"]

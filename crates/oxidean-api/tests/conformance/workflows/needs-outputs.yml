name: needs-outputs
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=2.5" >> $GITHUB_OUTPUT
  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "got-version=${{ needs.build.outputs.version }}"

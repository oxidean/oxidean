name: artifact-overwrite
on: [push]
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p out && echo "version-one" > out/v.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: out/**
      - run: echo "version-two" > out/v.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: out/**
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dl
      - run: cat dl/out/v.txt

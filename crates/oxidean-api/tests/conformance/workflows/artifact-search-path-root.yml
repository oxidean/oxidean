name: artifact-search-path-root
on: [push]
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p build/libs && echo "app-content" > build/libs/app.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar-art
          path: build/

  down:
    needs: [up]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jar-art
          path: dl
      - run: cat dl/libs/app.jar

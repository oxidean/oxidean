[package]
name = "oxidean-api"
version = "0.4.1"
edition.workspace = true
license.workspace = true

[lib]
name = "oxidean_api"
path = "src/lib.rs"

[[bin]]
name = "oxidean-api"
path = "src/main.rs"

[[bin]]
name = "rpc-gen"
path = "src/bin/rpc_gen.rs"

[[bin]]
name = "openapi-gen"
path = "src/bin/openapi_gen.rs"

[[bin]]
name = "oxidean-protection-hook"
path = "src/bin/protection_hook.rs"

[dependencies]
oxidean-api-actions = { path = "../oxidean-api-actions" }
oxidean-api-admin = { path = "../oxidean-api-admin" }
oxidean-api-discussion = { path = "../oxidean-api-discussion" }
oxidean-api-project = { path = "../oxidean-api-project" }
oxidean-api-check = { path = "../oxidean-api-check" }
oxidean-api-webhook = { path = "../oxidean-api-webhook" }
oxidean-api-user = { path = "../oxidean-api-user" }
oxidean-api-oauth = { path = "../oxidean-api-oauth" }
oxidean-api-mirror = { path = "../oxidean-api-mirror" }
oxidean-api-packages = { path = "../oxidean-api-packages" }
oxidean-api-release = { path = "../oxidean-api-release" }
oxidean-api-pages = { path = "../oxidean-api-pages" }
oxidean-api-merge-queue = { path = "../oxidean-api-merge-queue" }
oxidean-api-pat = { path = "../oxidean-api-pat" }
oxidean-api-notification = { path = "../oxidean-api-notification" }
oxidean-api-deployment = { path = "../oxidean-api-deployment" }
oxidean-api-wiki = { path = "../oxidean-api-wiki" }
oxidean-api-email = { path = "../oxidean-api-email" }
oxidean-api-keys = { path = "../oxidean-api-keys" }
oxidean-api-auth = { path = "../oxidean-api-auth" }
oxidean-api-vcs = { path = "../oxidean-api-vcs" }
oxidean-api-core = { path = "../oxidean-api-core" }
oxidean-api-issues = { path = "../oxidean-api-issues" }
oxidean-api-org = { path = "../oxidean-api-org" }
oxidean-api-pulls = { path = "../oxidean-api-pulls" }
oxidean-api-repo = { path = "../oxidean-api-repo" }
oxidean-api-rest = { path = "../oxidean-api-rest" }
oxidean-core = { path = "../oxidean-core" }
oxidean-db = { path = "../oxidean-db" }
oxidean-git = { path = "../oxidean-git" }
oxidean-actions-expr = { path = "../oxidean-actions-expr" }
oxidean-vcs = { path = "../oxidean-vcs", features = ["server"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
async-trait = "0.1.92"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
  "charset",
  "http2",
  "system-proxy",
] }
sha2 = "0.11.1"
crypto_box = { version = "0.9.1", features = ["salsa20", "seal", "getrandom"] }
rand = "0.10.3"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = "0.4.45"
flate2 = "1.1"
tar = "0.4"
workos = "3.5"
url = "2.5.8"
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "dds",
  "ff",
  "gif",
  "hdr",
  "ico",
  "jpeg",
  "png",
  "pnm",
  "qoi",
  "rayon",
  "tga",
  "tiff",
  "webp",
] }
tempfile = "3"
ssh-key = { version = "=0.7.0-rc.11", features = ["std", "alloc"] }
russh = { version = "0.64", features = ["aws-lc-rs"] }
serde_yaml = "0.9"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
base64 = "0.23"
tokio-util = { version = "0.7.20", features = ["io"] }
hex = "0.4.3"

[dev-dependencies]
oxidean-runner = { path = "../oxidean-runner" }
prost = "0.14"
prost-types = "0.14"
http-body-util = "0.1"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.30"
tempfile = "3"
wiremock = "0.6.5"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[build-dependencies]


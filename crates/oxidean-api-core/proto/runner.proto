// Oxidean Actions runner protocol — custom JSON surface consumed by
// crates/oxidean-runner (see /api/actions/* routes).
syntax = "proto3";
package oxidean.actions.v1;

message RegisterRequest {
  string name = 1;
  repeated string labels = 2;
  string token = 3;
}

message RegisterResponse {
  string runner_id = 1;
  string runner_token = 2;
}

message DeclareRequest {
  repeated string labels = 1;
}

message DeclareResponse {
  bool ok = 1;
}

message FetchTaskRequest {}

message FetchTaskResponse {
  string job_id = 1;
  string run_id = 2;
  string job_key = 3;
  repeated string runs_on = 4;
  string workflow_path = 5;
  string workflow_name = 6;
  string head_sha = 7;
  string head_ref = 8;
  // JSON array of step objects (name/uses/run/shell/…) for runner clients.
  string steps_json = 9;
  // JSON object of decrypted secret name → value (never logged).
  string secrets_json = 10;
  // Repository coordinates so runners can clone {origin}/{owner}/{repo}.git.
  string repository_owner = 11;
  string repository_name = 12;
  // Triggering event name (push, pull_request, workflow_dispatch, …).
  string event = 13;
  int64 run_number = 14;
  // Always 1: requeueing reuses the run row (no attempt counter exists yet).
  int64 run_attempt = 15;
  // Triggering user's username / id ("" when system-triggered).
  string actor = 16;
  string actor_id = 17;
  string repository_id = 18;
  // Owner user id or org id, whichever owner_ref_for_repo resolves.
  string repository_owner_id = 19;
  // Instance public origin (OXIDEAN_PUBLIC_ORIGIN / Railway gateway).
  string server_url = 20;
  // PR context for pull_request runs only ("" / 0 otherwise).
  string base_ref = 21;
  int64 pull_number = 22;
  // Per-job OXIDEAN_TOKEN (`oxidean_job_…` bearer); "" when not minted.
  string job_token = 23;
  // Granted contents level for job_token: "read" | "write" | "".
  string job_token_permission = 24;
  // "{owner}/{repo}/{workflow_path}@{head_ref}".
  string workflow_ref = 25;
}

message UpdateTaskRequest {
  string job_id = 1;
  string state = 2; // in_progress | success | failure | cancelled
}

message UpdateTaskResponse {
  bool ok = 1;
}

message UpdateLogRequest {
  string run_id = 1;
  string job_id = 2;
  bytes chunk = 3;
}

message UpdateLogResponse {
  bool ok = 1;
}

service RunnerService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Declare(DeclareRequest) returns (DeclareResponse);
  rpc FetchTask(FetchTaskRequest) returns (FetchTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc UpdateLog(UpdateLogRequest) returns (UpdateLogResponse);
}

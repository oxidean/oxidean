[package]
name = "oxidean-db"
version = "0.3.1"
edition.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
oxidean-core = { path = "../oxidean-core" }
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "mysql",
  "sqlite",
  "migrate",
  "macros",
  "chrono",
] }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"

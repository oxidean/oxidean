[package]
name = "oxidean-api-oxpilot"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "oxidean_api_oxpilot"
path = "src/lib.rs"

[dependencies]
oxidean-api-core = { path = "../oxidean-api-core" }
oxidean-core = { path = "../oxidean-core" }
oxidean-db = { path = "../oxidean-db" }
# `text_diff::diff_lines` — the canonical propose-diff renderer; the
# module is `server`-gated upstream.
oxidean-vcs = { path = "../oxidean-vcs", features = ["server"] }
# `content_b64` decodes for the generated patch — same pin the CLI uses.
base64 = "0.22.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
chrono = "0.4.45"
uuid = { version = "1.29.0", features = ["v4"] }
axum = { version = "0.8" }
futures-util = "0.3"
tokio-util = { version = "0.7.20", features = ["rt"] }
# Provider adapters run raw reqwest (no provider SDK crates — BR5.3/Q4).
# Feature set mirrors api-core's pin plus `stream` for bytes_stream().
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
  "stream",
  "charset",
  "http2",
  "system-proxy",
] }
async-trait = "0.1.92"
rand = "0.10.3"
url = "2.5.8"
# Named only for the `bytes_stream()` chunk type in decoder state —
# already in the tree via reqwest; no new code pulled in.
bytes = "1"

[dev-dependencies]
# Wiremock-only provider tests (NFR8.1) — golden SSE/NDJSON fixtures and
# error-status sets; never a live provider call or real key material.
wiremock = "0.6.5"
# The settings integration suite drives the real assembled router — the
# shell is a dev-only edge, identical to crates/oxidean-api/tests/oxpilot.rs.
oxidean-api = { path = "../oxidean-api" }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
chrono = "0.4.45"

[package]
name = "oxidean-api-keys"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
name = "oxidean_api_keys"
path = "src/lib.rs"

[dependencies]
oxidean-api-core = { path = "../oxidean-api-core" }
oxidean-core = { path = "../oxidean-core" }
oxidean-db = { path = "../oxidean-db" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
uuid = { version = "1.26.0", features = ["v4"] }
tokio = { workspace = true }
ssh-key = { version = "=0.7.0-rc.11", features = ["std", "alloc"] }

[package]
name = "wasm-app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"

# Embedded template asset — standalone manifest, not a workspace member.
[workspace]

# Template asset: deps are consumed by generated projects, not this repo.
[package.metadata.cargo-machete]
ignored = ["wasm-bindgen-test"]

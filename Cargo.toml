[workspace]
resolver = "2"
members = [
  "crates/oxidean-api",
  "crates/oxidean-core",
  "crates/oxidean-db",
  "crates/oxidean-git",
  "crates/oxidean-runner",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }

# Thin debuginfo keeps fast links + useful panic backtraces without paying for
# full dep debug data. `cargo build --profile debugging` restores full debuginfo.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
lto = "thin"
strip = "symbols"

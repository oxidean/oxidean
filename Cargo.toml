[workspace]
resolver = "2"
members = [
  "crates/oxidean-actions-expr",
  "crates/oxidean-api",
  "crates/oxidean-api-actions",
        "crates/oxidean-api-admin",
        "crates/oxidean-api-auth",
        "crates/oxidean-api-discussion",
        "crates/oxidean-api-project",
        "crates/oxidean-api-check",
        "crates/oxidean-api-webhook",
        "crates/oxidean-api-user",
        "crates/oxidean-api-oauth",
        "crates/oxidean-api-oxpilot",
        "crates/oxidean-api-packages",
        "crates/oxidean-api-mirror",
        "crates/oxidean-api-pat",
        "crates/oxidean-api-merge-queue",
        "crates/oxidean-api-pages",
        "crates/oxidean-api-release",
        "crates/oxidean-api-keys",
        "crates/oxidean-api-email",
        "crates/oxidean-api-wiki",
        "crates/oxidean-api-deployment",
        "crates/oxidean-api-notification",
        "crates/oxidean-api-vcs",
  "crates/oxidean-api-core",
  "crates/oxidean-api-issues",
  "crates/oxidean-api-org",
  "crates/oxidean-api-pulls",
  "crates/oxidean-api-rest",
  "crates/oxidean-api-repo",
  "crates/oxidean-cli",
  "crates/oxidean-core",
  "crates/oxidean-db",
  "crates/oxidean-git",
  "crates/oxidean-runner",
  "crates/oxidean-status-pages",
  "crates/oxidean-storage",
  "crates/oxidean-vcs",
  "crates/oxidean-web",
]
# Embedded project-template manifests served as assets — not workspace crates.
exclude = [
  "crates/oxidean-api-repo/assets/stack-presets/rust",
  "crates/oxidean-api-repo/assets/stack-presets/tauri/src-tauri",
  "crates/oxidean-api-repo/assets/stack-presets/wasm",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", features = ["preserve_order"] }
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }

# Thin debuginfo keeps fast links + useful panic backtraces without paying for
# full dep debug data. `cargo build --profile debugging` restores full debuginfo.
[profile.dev]
debug = "line-tables-only"

# Deps get no debuginfo and opt-level 1: the integration suite is CPU-bound on
# dependency code (sqlx/serde/axum), so unoptimized deps cost real test time.
# crypto gets O3 — tests exercise argon2 via auth.signup/auth.login fixtures.
[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
lto = "thin"
strip = "symbols"

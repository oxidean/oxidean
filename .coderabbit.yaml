# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en
reviews:
  path_filters:
    # Archived spec material (GSD milestone history, retired AI-DLC intents)
    # inflates the diff far past the 300-file review limit — read-only
    # planning records, not shipped code.
    - "!.ox-agent/context/specs/_archive/**"
    # ox-agent managed assets materialize from the Ox-Agent distribution on
    # `init --repair --sync` and are hash-tracked by assets.lock — findings
    # on them get fixed upstream, not in place.
    - "!.ox-agent/assets.lock"
    - "!.ox-agent/framework.yaml"
    - "!.ox-agent/context/index.yaml"
    - "!.ox-agent/integrations/**"
    - "!.ox-agent/lifecycle/**"
    - "!.ox-agent/pipelines/**"
    - "!.ox-agent/schemas/**"
    - "!.ox-agent/state/**"
    - "!.ox-agent/workflows/**"
    - "!.ox-agent/skills/adr/**"
    - "!.ox-agent/skills/brainstorm/**"
    - "!.ox-agent/skills/clean-user-facing-text/**"
    - "!.ox-agent/skills/code-review/**"
    - "!.ox-agent/skills/discover-context/**"
    - "!.ox-agent/skills/discussion/**"
    - "!.ox-agent/skills/implementation/**"
    - "!.ox-agent/skills/multi-stage-plan/**"
    - "!.ox-agent/skills/progress/**"
    - "!.ox-agent/skills/remove-ai-marks/**"
    - "!.ox-agent/skills/retrospective/**"
    - "!.ox-agent/skills/shipping/**"
    - "!.ox-agent/skills/specify/**"
    - "!.ox-agent/skills/tdd/**"
    - "!.ox-agent/skills/verify/**"
    # Vendored third-party skill content is installed verbatim via `npx skills
    # add` and locked by skills-lock.json — its example snippets are teaching
    # material, not shipped product code, and flagging them produces review
    # noise. Extend the list when more skills are vendored; team-authored
    # skills stay in scope.
    - "!.ox-agent/skills/security-review/**"
    - "!.devin/skills/security-review"
  profile: chill
  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: false
    gitleaks:
      enabled: true
    checkov:
      enabled: false
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    github-checks:
      enabled: false
  high_level_summary: true
  review_status: true
  commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: true
  poem: false
  labeling_instructions: []
  path_instructions: []
  auto_approvals:
    # Approve automatically once a review is clean and all threads are
    # resolved; CodeRabbit requests changes on blocking findings instead.
    enabled: true
  auto_review:
    # Reviews run on demand only (@coderabbitai review / dashboard), not
    # automatically on open or push.
    enabled: false
    auto_incremental_review: false
    ignore_title_keywords: []
    drafts: false
    base_branches: []

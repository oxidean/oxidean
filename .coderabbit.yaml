# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en
reviews:
  path_filters:
    # Archived spec material (GSD milestone history, retired AI-DLC intents)
    # inflates the diff far past the 300-file review limit — read-only
    # planning records, not shipped code.
    - "!agent-os/specs/_archive/**"
    # Retired AI-DLC harness surface deleted by the spec-setup migration —
    # these paths no longer exist post-merge, so the filters only ever match
    # that PR's deletions (581 files, otherwise over the 300-file review cap).
    # Prune this block once `.claude`/`.cursor` aidlc paths are forgotten.
    - "!aidlc/**"
    - "!.claude/CLAUDE.md"
    - "!.claude/settings.json"
    - "!.claude/settings.local.json.example"
    - "!.claude/agents/**"
    - "!.claude/aidlc-common/**"
    - "!.claude/hooks/**"
    - "!.claude/knowledge/**"
    - "!.claude/rules/**"
    - "!.claude/scopes/**"
    - "!.claude/sensors/**"
    - "!.claude/skills/**"
    - "!.claude/tools/**"
    - "!.cursor/agents/**"
    - "!.cursor/aidlc-common/**"
    - "!.cursor/cli.json"
    - "!.cursor/hooks/**"
    - "!.cursor/hooks.json"
    - "!.cursor/knowledge/**"
    - "!.cursor/scopes/**"
    - "!.cursor/sensors/**"
    - "!.cursor/skills/**"
    - "!.cursor/tools/**"
    - "!.cursor/rules/aidlc*.mdc"
    # Vendored third-party skill content is installed verbatim via `npx skills
    # add` and locked by skills-lock.json — its example snippets are teaching
    # material, not shipped product code, and flagging them produces review
    # noise. Extend the list when more skills are vendored; team-authored
    # skills stay in scope.
    - "!.agents/skills/security-review/**"
    - "!.devin/skills/security-review"
  profile: chill
  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: false
    gitleaks:
      enabled: true
    checkov:
      enabled: false
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    github-checks:
      enabled: false
  high_level_summary: true
  review_status: true
  commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: true
  poem: false
  labeling_instructions: []
  path_instructions: []
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    drafts: false
    base_branches: []
